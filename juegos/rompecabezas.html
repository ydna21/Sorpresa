<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rompecabezas</title>
<style>
  body {
    margin: 0; background: black; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 100vh;
    font-family: 'Courier New', monospace; color: white;
  }
  h2 { color: #ff69b4; text-shadow: 0 0 10px #ff69b4; text-align: center; margin-bottom: 5px; }
  p { margin-top: 0; color: #ddd; font-size: 0.9rem; margin-bottom: 20px; text-align: center; padding: 0 10px;}
  
  /* --- GALERÍA DE SELECCIÓN CON SCROLL --- */
  #selector-fotos {
    display: flex; flex-direction: column; align-items: center;
    background: rgba(255, 105, 180, 0.1); border: 2px solid #ff69b4;
    border-radius: 15px; padding: 20px; max-width: 90%; width: 320px;
    box-shadow: 0 0 20px rgba(255,105,180,0.3); box-sizing: border-box;
  }
  
  .indicador-scroll {
    font-size: 0.8rem; color: #ffb6c1; margin-top: 5px; font-style: italic;
    animation: palpitar 2s infinite;
  }
  @keyframes palpitar {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .galeria {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
    margin-top: 10px; width: 100%;
    max-height: 250px; /* Límite de altura para activar el scroll */
    overflow-y: auto;  /* Permite deslizar arriba/abajo */
    padding-right: 10px; /* Espacio para la barra de desplazamiento */
  }
  
  /* Personalización de la barra de desplazamiento (Scrollbar) */
  .galeria::-webkit-scrollbar {
    width: 8px;
  }
  .galeria::-webkit-scrollbar-track {
    background: rgba(255, 105, 180, 0.1);
    border-radius: 10px;
  }
  .galeria::-webkit-scrollbar-thumb {
    background: #ff69b4;
    border-radius: 10px;
    box-shadow: 0 0 5px #ff69b4;
  }

  .galeria img {
    width: 100%; height: 110px; object-fit: cover; border-radius: 10px;
    border: 2px solid transparent; cursor: pointer; transition: 0.3s;
  }
  .galeria img:hover {
    transform: scale(1.05); border-color: #ff69b4; box-shadow: 0 0 15px #ff69b4;
  }
  .foto-favorita {
    border: 2px solid #ff1493 !important;
    box-shadow: 0 0 10px rgba(255, 20, 147, 0.5);
  }

  /* --- CONTENEDOR DEL JUEGO --- */
  #juego-container {
    display: none; flex-direction: column; align-items: center; position: relative;
  }
  
  #puzzleCanvas { 
    border: 4px solid #ff69b4; border-radius: 10px; 
    box-shadow: 0 0 20px #ff69b4; max-width: 90%; background: #111;
  }
  
  /* --- BOTÓN DE VISTA PREVIA --- */
  #btn-preview {
    margin-top: 15px; padding: 10px 20px; font-size: 1rem; background: #ff1493;
    color: white; border: none; border-radius: 20px; cursor: pointer; 
    box-shadow: 0 0 15px rgba(255,20,147,0.6); font-family: 'Courier New', monospace;
    font-weight: bold; transition: 0.2s; user-select: none;
  }
  #btn-preview:active { transform: scale(0.95); }

  #preview-overlay {
    position: absolute; top: 0; left: 50%; transform: translateX(-50%);
    width: 300px; height: 300px; border-radius: 10px;
    background-size: cover; background-position: center;
    border: 4px solid #00ffff; box-shadow: 0 0 30px #00ffff;
    opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 10;
  }

  .btn-regresar {
    margin-top: 25px; padding: 12px 25px; font-size: 1rem; background: #333;
    color: white; border: none; border-radius: 12px; cursor: pointer;
    text-decoration: none; transition: 0.3s;
  }
  .btn-regresar:hover { background: #555; }

  /* --- MODAL DE VICTORIA --- */
  #modalVictoria {
    display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(0,0,0,0.85); z-index: 50; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    animation: fadeIn 0.5s ease;
  }
  .modal-contenido {
    background: white; color: #333; padding: 30px; border-radius: 20px;
    box-shadow: 0 0 40px #ff69b4; max-width: 80%;
  }
  .modal-contenido h3 { color: #ff69b4; font-size: 1.8rem; margin-top: 0; }
  .modal-btn {
    margin-top: 20px; padding: 10px 20px; background: #ff69b4; color: white;
    border: none; border-radius: 10px; font-size: 1.1rem; cursor: pointer;
    font-weight: bold; font-family: 'Courier New', monospace;
  }
  @keyframes fadeIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
</style>
  <meta name="theme-color" content="#000000">
</head>
<body>

  <h2>🧩 Nuestro Rompecabezas 🧩</h2>
  <p id="instrucciones">Elige una foto para empezar a jugar 🎵</p>
  
  <audio id="musicaJuego" loop>
    <source src="../musica.mp3" type="audio/mpeg">
  </audio>

  <!-- MENÚ DE SELECCIÓN CON SCROLL -->
  <div id="selector-fotos">
    <div style="font-weight:bold; color:#ff69b4; font-size:1.1rem;">Galería de Recuerdos</div>
    <div class="indicador-scroll">⬇️ Desliza para ver más</div>
    <div class="galeria">
      <!-- 1. Foto principal suelta (la favorita) -->
      <img src="../puzzle.jpg" class="foto-favorita" title="Nuestra favorita" onclick="iniciarJuego('../puzzle.jpg')">
      <!-- 2 al 6. Fotos en la carpeta -->
      <img src="../fotos/foto1.jpg" onclick="iniciarJuego('../fotos/foto1.jpg')">
      <img src="../fotos/foto2.jpg" onclick="iniciarJuego('../fotos/foto2.jpg')">
      <img src="../fotos/foto3.jpg" onclick="iniciarJuego('../fotos/foto3.jpg')">
      <img src="../fotos/foto4.jpg" onclick="iniciarJuego('../fotos/foto4.jpg')">
      <img src="../fotos/foto5.jpg" onclick="iniciarJuego('../fotos/foto5.jpg')">
    </div>
  </div>

  <!-- ÁREA DE JUEGO -->
  <div id="juego-container">
    <div style="position: relative;">
      <canvas id="puzzleCanvas" width="300" height="300"></canvas>
      <div id="preview-overlay"></div>
    </div>
    
    <button id="btn-preview">👁️</button>
  </div>
  
  <a href="../juegos.html" class="btn-regresar">⬅️ Regresar a Juegos</a>

  <!-- MODAL DE VICTORIA -->
  <div id="modalVictoria">
    <div class="modal-contenido">
      <h3>¡Felicidades mi amor! 🎉</h3>
      <p style="font-weight: bold; font-size: 1.1rem; color: #444;">Has completado el recuerdo 💖</p>
      <button class="modal-btn" onclick="volverAGaleria()">Armar otra foto</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById("puzzleCanvas");
    const ctx = canvas.getContext("2d");
    const size = 300;
    const rows = 3, cols = 3;
    const pieceSize = size / rows;
    const img = new Image();
    
    const musica = document.getElementById('musicaJuego');
    const selectorFotos = document.getElementById('selector-fotos');
    const juegoContainer = document.getElementById('juego-container');
    const instrucciones = document.getElementById('instrucciones');
    const previewOverlay = document.getElementById('preview-overlay');
    const btnPreview = document.getElementById('btn-preview');
    const modalVictoria = document.getElementById('modalVictoria');

    let board = []; 
    let emptyIndex = 8; 

    // --- FUNCIÓN PARA INICIAR EL JUEGO ---
    function iniciarJuego(rutaImagen) {
      if (musica.paused) musica.play();
      
      selectorFotos.style.display = 'none';
      juegoContainer.style.display = 'flex';
      instrucciones.innerText = "";
      
      // Configurar la imagen seleccionada y la vista previa
      img.src = rutaImagen;
      previewOverlay.style.backgroundImage = `url('${rutaImagen}')`;
      
      img.onload = function(){
        board = [];
        for(let i=0; i<rows*cols; i++) board.push(i);
        shuffleBoard();
        drawPuzzle();
      };
    }

    function volverAGaleria() {
      modalVictoria.style.display = 'none';
      juegoContainer.style.display = 'none';
      selectorFotos.style.display = 'flex';
      instrucciones.innerText = "Elige una foto para empezar a jugar 🎵";
    }

    // --- LÓGICA DEL BOTÓN DE VISTA PREVIA ---
    function mostrarGuia() { previewOverlay.style.opacity = '1'; }
    function ocultarGuia() { previewOverlay.style.opacity = '0'; }

    btnPreview.addEventListener('mousedown', mostrarGuia);
    btnPreview.addEventListener('mouseup', ocultarGuia);
    btnPreview.addEventListener('mouseleave', ocultarGuia);
    
    btnPreview.addEventListener('touchstart', (e) => { e.preventDefault(); mostrarGuia(); });
    btnPreview.addEventListener('touchend', ocultarGuia);

    // --- LÓGICA DEL ROMPECABEZAS ---
    function shuffleBoard() {
      for (let i = 0; i < 150; i++) { 
        const neighbors = getNeighbors(emptyIndex);
        const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
        swap(emptyIndex, randomNeighbor);
        emptyIndex = randomNeighbor;
      }
    }

    function getNeighbors(idx) {
      const r = Math.floor(idx / cols);
      const c = idx % cols;
      const neighbors = [];
      if (r > 0) neighbors.push(idx - cols); 
      if (r < rows - 1) neighbors.push(idx + cols); 
      if (c > 0) neighbors.push(idx - 1); 
      if (c < cols - 1) neighbors.push(idx + 1); 
      return neighbors;
    }

    function drawPuzzle(){
      ctx.clearRect(0, 0, size, size);
      board.forEach((pieceOriginalIndex, currentPosIndex) => {
        if (pieceOriginalIndex === rows * cols - 1) return; // Pieza vacía
        
        const drawRow = Math.floor(currentPosIndex / cols);
        const drawCol = currentPosIndex % cols;
        const imgRow = Math.floor(pieceOriginalIndex / cols);
        const imgCol = pieceOriginalIndex % cols;
        
        // Recortar la imagen en formato cuadrado centrado
        const imgSize = Math.min(img.width, img.height);
        const sx = (img.width - imgSize) / 2;
        const sy = (img.height - imgSize) / 2;
        
        ctx.drawImage(
          img,
          sx + imgCol * (imgSize/cols), sy + imgRow * (imgSize/rows), (imgSize/cols), (imgSize/rows),
          drawCol * pieceSize, drawRow * pieceSize, pieceSize, pieceSize
        );
        ctx.strokeStyle = "#ff69b4";
        ctx.lineWidth = 2;
        ctx.strokeRect(drawCol * pieceSize, drawRow * pieceSize, pieceSize, pieceSize);
      });
    }

    function handleClick(x, y) {
      const col = Math.floor(x / pieceSize);
      const row = Math.floor(y / pieceSize);
      const clickedIndex = row * cols + col;
      const neighbors = getNeighbors(emptyIndex);
      
      if (neighbors.includes(clickedIndex)) {
        swap(emptyIndex, clickedIndex);
        emptyIndex = clickedIndex;
        drawPuzzle();
        checkWin();
      }
    }

    function swap(i, j) {
      [board[i], board[j]] = [board[j], board[i]];
    }

    function checkWin() {
      const isWin = board.every((val, index) => val === index);
      if (isWin) {
        // Dibuja la última pieza faltante para completar la foto
        const imgSize = Math.min(img.width, img.height);
        const sx = (img.width - imgSize) / 2;
        const sy = (img.height - imgSize) / 2;
        
        ctx.drawImage(
          img,
          sx + 2 * (imgSize/cols), sy + 2 * (imgSize/rows), (imgSize/cols), (imgSize/rows),
          2 * pieceSize, 2 * pieceSize, pieceSize, pieceSize
        );
        
        setTimeout(() => {
          modalVictoria.style.display = 'flex';
        }, 300);
      }
    }

    // Interacciones del Canvas
    canvas.onmousedown = (e) => { handleClick(e.offsetX, e.offsetY); };
    canvas.ontouchstart = (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      handleClick(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    };
  </script>
</body>
</html>
