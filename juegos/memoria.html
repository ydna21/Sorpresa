<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memoria de Amor</title>
<style>
  body {
    margin: 0; background: black; display: flex; flex-direction: column;
    align-items: center; justify-content: center; min-height: 100vh;
    font-family: 'Courier New', monospace; color: white;
  }
  h2 { color: #ff69b4; text-shadow: 0 0 10px #ff69b4; margin-bottom: 10px; text-align: center;}
  p { margin-top: 0; color: #ddd; font-size: 0.9rem; }
  
  .game-board {
    display: grid; grid-template-columns: repeat(4, 70px); gap: 10px;
    perspective: 1000px; margin-bottom: 20px;
  }
  
  .card {
    width: 70px; height: 90px; cursor: pointer; position: relative;
    transform-style: preserve-3d; transition: transform 0.6s;
  }
  
  .card.flipped { transform: rotateY(180deg); }
  
  .card-face {
    position: absolute; width: 100%; height: 100%; backface-visibility: hidden;
    display: flex; align-items: center; justify-content: center;
    font-size: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(255,105,180,0.5);
  }
  
  .card-front {
    background: #ff69b4; transform: rotateY(180deg); border: 2px solid white;
  }
  
  .card-back {
    background: linear-gradient(45deg, #330033, #000);
    border: 2px solid #ff69b4; color: #ff69b4; font-size: 1.5rem;
  }

  .btn-regresar {
    padding: 12px 25px; font-size: 1.1rem; background: #333;
    color: white; border: none; border-radius: 12px; cursor: pointer;
    text-decoration: none; transition: 0.3s;
  }
  .btn-regresar:hover { background: #555; }
</style>
</head>
<body>

  <h2>🎴 Memoria de Amor 🎴</h2>
  <p>Encuentra los pares para descubrir un mensaje</p>
  
  <div class="game-board" id="board"></div>
  
  <a href="../juegos.html" class="btn-regresar">⬅️ Regresar a Juegos</a>

  <script>
    const emojis = ['💖', '💌', '🌹', '✨', '🍓', '🎀'];
    let cardsArray = [...emojis, ...emojis];
    let hasFlippedCard = false;
    let lockBoard = false;
    let firstCard, secondCard;
    let paresEncontrados = 0;

    const board = document.getElementById('board');

    // Mezclar cartas
    cardsArray.sort(() => 0.5 - Math.random());

    // Crear cartas en el HTML
    cardsArray.forEach(emoji => {
      const card = document.createElement('div');
      card.classList.add('card');
      card.dataset.emoji = emoji;

      card.innerHTML = `
        <div class="card-face card-front">${emoji}</div>
        <div class="card-face card-back">?</div>
      `;
      card.addEventListener('click', flipCard);
      board.appendChild(card);
    });

    function flipCard() {
      if (lockBoard) return;
      if (this === firstCard) return;

      this.classList.add('flipped');

      if (!hasFlippedCard) {
        hasFlippedCard = true;
        firstCard = this;
        return;
      }

      secondCard = this;
      checkForMatch();
    }

    function checkForMatch() {
      let isMatch = firstCard.dataset.emoji === secondCard.dataset.emoji;

      if (isMatch) {
        disableCards();
        paresEncontrados++;
        if(paresEncontrados === emojis.length) {
          setTimeout(() => alert("🎉 ¡Qué buena memoria mi amor! Eres increíble 💖"), 500);
        }
      } else {
        unflipCards();
      }
    }

    function disableCards() {
      firstCard.removeEventListener('click', flipCard);
      secondCard.removeEventListener('click', flipCard);
      resetBoard();
    }

    function unflipCards() {
      lockBoard = true;
      setTimeout(() => {
        firstCard.classList.remove('flipped');
        secondCard.classList.remove('flipped');
        resetBoard();
      }, 1000);
    }

    function resetBoard() {
      [hasFlippedCard, lockBoard] = [false, false];
      [firstCard, secondCard] = [null, null];
    }
  </script>
</body>
</html>
