<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Viaje al Centro de Nuestro Hilo 🧵✨</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
  canvas { display: block; position: fixed; top: 0; left: 0; width: 100%; height: 100%; }
  
  #contenedorMedia {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10; pointer-events: none;
    perspective: 1200px;
  }

  .recuerdo-3d {
    position: absolute;
    border: 2px solid rgba(255, 255, 255, 0.3);
    box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
    border-radius: 12px;
    object-fit: cover;
    transform-origin: center;
    display: none;
    background: #111;
    will-change: left, top, width, height, opacity;
  }

  #controles {
    position: fixed; bottom: max(40px, env(safe-area-inset-bottom) + 20px); width: 100%; text-align: center;
    z-index: 100; display: none;
  }
  #controles.visible { display: block; animation: aparecer 1.4s ease both; }
  @keyframes aparecer { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  
  .btn {
    padding: 14px 28px; background: rgba(0, 0, 0, 0.8); color: white;
    border: 2px solid #ff0000; border-radius: 50px; cursor: pointer; 
    text-decoration: none; font-weight: bold; margin: 6px 10px;
    box-shadow: 0 0 20px rgba(255, 0, 0, 0.4); transition: 0.3s;
    display: inline-block;
  }
  .btn:hover { background: #ff0000; transform: scale(1.1); }

  /* ESTILOS PARA EL BOTÓN SECRETO */
  #btnSecreto {
    display: none; /* Oculto por defecto */
    border-color: #ff1493; 
    box-shadow: 0 0 30px #ff1493; 
    animation: latidoSecreto 1s infinite alternate;
  }
  @keyframes latidoSecreto {
    0% { transform: scale(1); box-shadow: 0 0 20px #ff1493; }
    100% { transform: scale(1.15); box-shadow: 0 0 40px #00ffff, 0 0 20px #ff1493 inset; }
  }

  #musicStatus {
    position: fixed; top: max(20px, env(safe-area-inset-top) + 8px); left: 20px; z-index: 100;
    color: rgba(255, 255, 255, 0.5); font-size: 0.7rem;
    letter-spacing: 1px; text-transform: uppercase;
    transition: color 1s ease;
  }
</style>
  <meta name="theme-color" content="#000000">
</head>
<body>

<audio id="musicaRojo" loop preload="auto">
  <source src="videos/musicarojo.mp3" type="audio/mpeg">
</audio>

<div id="musicStatus">MUEVE EL CURSOR PARA GUIAR EL DESTINO 🎵</div>

<canvas id="canvasMundo"></canvas>
<div id="contenedorMedia"></div>

<div id="controles">
  <a href="hilo_rojo.html" class="btn">🧵 Volver</a>
  <a href="index.html" class="btn" style="border-color: #555;">🏠 Inicio</a>
  <!-- BOTÓN SECRETO -->
  <a href="secreto_universo.html" class="btn" id="btnSecreto">🌌 PORTAL SECRETO</a>
</div>

<script>
const canvas = document.getElementById('canvasMundo');
const ctx = canvas.getContext('2d');
const contenedor = document.getElementById('contenedorMedia');
const audio = document.getElementById('musicaRojo');
const statusTxt = document.getElementById('musicStatus');
const btnSecreto = document.getElementById('btnSecreto');

const misRecuerdosOriginales = [];
for (let i = 1; i <= 40; i++) { misRecuerdosOriginales.push({ type: 'img', src: `fotos/foto${i}.jpg` }); }
for (let j = 1; j <= 10; j++) { misRecuerdosOriginales.push({ type: 'video', src: `videos/video${j}.mp4` }); }

let recuerdosDisponibles = [...misRecuerdosOriginales];
let width, height;
let centerX, centerY;
let targetX, targetY;
let stars = [];
let mediaObjects = [];
let relojIniciado = false;
let tiempoTotal = 0, spawnTimer = 70 / 60, controlesVisibles = false, ordenZ = 100000;
const listos = [];          // recuerdos ya cargados, esperando salir
let pendientes = 0, fallos = 0;
const dpr = Math.min(window.devicePixelRatio || 1, 2);

function ajustarLienzo() {
  width = window.innerWidth;
  height = window.innerHeight;
  canvas.width = Math.round(width * dpr);
  canvas.height = Math.round(height * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function init() {
  ajustarLienzo();
  centerX = width / 2;
  centerY = height / 2;
  targetX = centerX;
  targetY = centerY;

  stars = [];
  for(let i=0; i<300; i++) {
    stars.push({ x: Math.random()*width*3 - width*1.5, y: Math.random()*height*3 - height*1.5, z: Math.random()*2000 });
  }
  shuffle(recuerdosDisponibles);
}

function apuntar(x, y) { targetX = x; targetY = y; }
window.addEventListener('mousemove', (e) => apuntar(e.clientX, e.clientY));
window.addEventListener('touchmove', (e) => { if (e.touches.length) apuntar(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });
window.addEventListener('touchstart', (e) => { if (e.touches.length) apuntar(e.touches[0].clientX, e.touches[0].clientY); }, { passive: true });

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
}

// --- LÓGICA DE INICIO Y TEMPORIZADOR EXACTO ---
function iniciarExperiencia() {
    if (audio.paused) {
        audio.volume = 0;
        audio.play().then(() => {
            // La música entra con un fundido suave
            const fade = setInterval(() => { audio.volume = Math.min(1, audio.volume + 0.05); if (audio.volume >= 1) clearInterval(fade); }, 100);
            statusTxt.innerText = "GUIANDO EL DESTINO 🎶";
            statusTxt.style.color = "#ff4444";
            
            // Si el reloj no ha iniciado, lo disparamos aquí
            if (!relojIniciado) {
                relojIniciado = true;
                
                // 326000 milisegundos = 5 minutos y 26 segundos
                setTimeout(() => {
                    btnSecreto.style.display = 'inline-block';
                    
                    statusTxt.innerText = "¡UN PORTAL SE HA ABIERTO EN EL TIEMPO! ✨";
                    statusTxt.style.color = "#00ffff";
                    statusTxt.style.textShadow = "0 0 10px #00ffff";
                }, 326000); 
            }
        }).catch(err => console.log("Esperando interacción..."));
    }
}

// Detectamos el clic o el toque (para celulares) para arrancar la música y el reloj a la vez
window.addEventListener('click', iniciarExperiencia);
window.addEventListener('touchstart', iniciarExperiencia, {passive: true});

// Si cambias de pestaña, la música se pausa y vuelve al regresar
document.addEventListener('visibilitychange', () => {
    if (document.hidden) audio.pause();
    else if (relojIniciado) audio.play().catch(() => {});
});

/* PRECARGA: los recuerdos se cargan antes de salir, así nunca aparece una caja vacía */
function siguienteRecuerdo() {
  if (recuerdosDisponibles.length === 0) {
    recuerdosDisponibles = [...misRecuerdosOriginales];
    shuffle(recuerdosDisponibles);
  }
  return recuerdosDisponibles.pop();
}

function precargar() {
  while (pendientes + listos.length < 2 && fallos < 300) {
    const data = siguienteRecuerdo();
    const el = document.createElement(data.type === 'img' ? 'img' : 'video');
    el.className = 'recuerdo-3d';
    pendientes++;
    const fallo = () => { fallos++; pendientes--; el.removeAttribute('src'); precargar(); };
    if (data.type === 'video') {
      el.muted = true; el.loop = true; el.playsInline = true; el.preload = 'auto';
      el.onloadeddata = () => { el.onloadeddata = null; pendientes--; listos.push(el); precargar(); };
    } else {
      el.decoding = 'async';
      el.onload = () => { pendientes--; listos.push(el); precargar(); };
    }
    el.onerror = fallo;
    el.src = data.src;
  }
}

function spawnMedia() {
  const el = listos.shift();
  precargar();
  if (!el) return false;
  el.onerror = null;
  el.style.zIndex = --ordenZ;   // lo más nuevo está más lejos: queda debajo de los anteriores (sin parpadeos)
  contenedor.appendChild(el);
  if (el.tagName === 'VIDEO') el.play().catch(() => {});

  mediaObjects.push({
    element: el,
    x: (Math.random() - 0.5) * 1800,
    y: (Math.random() - 0.5) * 1200,
    z: 2000, 
    w: 240, 
    h: 180 
  });
  return true;
}

function quitarMedia(m) {
  const el = m.element;
  el.remove();
  if (el.tagName === 'VIDEO') { el.pause(); el.removeAttribute('src'); el.load(); }
}

let ultimo = performance.now();

function update(ahora) {
  requestAnimationFrame(update);

  // Todo el movimiento va por tiempo (no por fotogramas): igual de fluido en 60, 90 o 120 Hz
  const dt = Math.min((ahora - ultimo) / 1000, 0.05);
  ultimo = ahora;
  const s = dt * 60;
  tiempoTotal += dt;

  const k = 1 - Math.pow(1 - 0.05, s);
  centerX += (targetX - centerX) * k;
  centerY += (targetY - centerY) * k;

  ctx.fillStyle = 'black';
  ctx.fillRect(0, 0, width, height);

  ctx.fillStyle = "white";
  stars.forEach(st => {
    st.z -= 15 * s;
    if(st.z <= 0) st.z += 2000;
    let f = 400 / st.z;
    let sx = st.x * f + centerX;
    let sy = st.y * f + centerY;
    ctx.globalAlpha = Math.max(0, 1 - (st.z / 2000));
    ctx.fillRect(sx, sy, f*2.5, f*2.5);
  });

  // HILO ROJO: la misma onda de siempre, pero más suave y con brillo sin efecto pesado
  const ahoraMs = Date.now();
  const hilo = new Path2D();
  for(let i=10; i<2000; i+=14) {
    let f = 400 / i;
    let waveX = Math.sin(ahoraMs * 0.003 + i * 0.008) * 80;
    let waveY = Math.cos(ahoraMs * 0.002 + i * 0.012) * 50;
    let hx = waveX * f + centerX;
    let hy = waveY * f + centerY;
    if(i === 10) hilo.moveTo(hx, hy);
    else hilo.lineTo(hx, hy);
  }
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.globalCompositeOperation = 'lighter';
  [[22, 0.05], [14, 0.09], [8, 0.18]].forEach(([w, a]) => {
    ctx.globalAlpha = 1; ctx.lineWidth = w; ctx.strokeStyle = `rgba(255,0,0,${a})`; ctx.stroke(hilo);
  });
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.strokeStyle = '#ff0000'; ctx.lineWidth = 4; ctx.stroke(hilo);
  ctx.strokeStyle = 'rgba(255,170,170,0.55)'; ctx.lineWidth = 1.3; ctx.stroke(hilo);

  // Recorremos al revés para poder quitar elementos sin saltarnos ninguno
  for (let index = mediaObjects.length - 1; index >= 0; index--) {
    const m = mediaObjects[index];
    m.z -= 12 * s;
    
    if(m.z <= 0) {
      quitarMedia(m);
      mediaObjects.splice(index, 1);
    } else {
      let f = 400 / m.z;
      let sx = m.x * f + centerX;
      let sy = m.y * f + centerY;
      let sw = m.w * f;
      let sh = m.h * f;

      const st = m.element.style;
      st.display = 'block';
      st.left = (sx - sw/2) + 'px';
      st.top = (sy - sh/2) + 'px';
      st.width = sw + 'px';
      st.height = sh + 'px';
      
      let op = 1 - (m.z / 2000); 
      if (m.z < 150) op = m.z / 150;
      st.opacity = Math.max(0, op);
    }
  }

  // Un recuerdo nuevo cada ~1.17 s (igual que antes: 70 fotogramas a 60 Hz)
  spawnTimer += dt;
  if (spawnTimer >= 70 / 60 && spawnMedia()) spawnTimer = 0;

  if (!controlesVisibles && tiempoTotal >= 350 / 60) {
    controlesVisibles = true;
    document.getElementById('controles').classList.add('visible');
  }
}

window.addEventListener('resize', () => {
  // Al cambiar de tamaño solo se ajusta el lienzo; el viaje no se reinicia
  const w0 = width, h0 = height;
  ajustarLienzo();
  centerX = width / 2 + (centerX - w0 / 2);
  centerY = height / 2 + (centerY - h0 / 2);
  targetX = Math.min(targetX, width); targetY = Math.min(targetY, height);
});

init();
precargar();
requestAnimationFrame(update);
</script>
</body>
</html>
