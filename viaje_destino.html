<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0b0418">
<title>Viaje al Centro de Nuestro Hilo 🧵✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --red:#ff3b4e; --glass:rgba(20,6,22,.55); --line:rgba(255,90,110,.45); --sans:'Jost',system-ui,sans-serif; --serif:'Cormorant Garamond',Georgia,serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:#0b0418; overflow:hidden; font-family:var(--sans); color:#fff; -webkit-font-smoothing:antialiased; }
  #lienzo { position:fixed; inset:0; z-index:1; touch-action:none; }
  #lienzo canvas { display:block; }
  #vineta { position:fixed; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at center, transparent 50%, rgba(8,2,16,.7) 100%); }

  #musicStatus { position:fixed; top:max(16px, env(safe-area-inset-top) + 6px); left:16px; z-index:100; max-width:calc(100vw - 32px); padding:8px 16px; border-radius:30px;
    background:var(--glass); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
    font-size:.68rem; font-weight:400; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.7); transition:color 1s, border-color 1s, box-shadow 1s; }

  #inicio { position:fixed; inset:0; z-index:50; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; pointer-events:none; transition:opacity 1.6s ease; }
  #inicio.fuera { opacity:0; }
  #inicio h2 { margin:0; font:italic 600 clamp(1.8rem,5vw,3rem)/1.1 var(--serif); color:#fff; text-shadow:0 0 30px rgba(255,59,78,.9), 0 2px 16px rgba(0,0,0,.6); animation:latido 2.6s ease-in-out infinite; }
  #inicio p { margin:0; font-weight:300; letter-spacing:.25em; text-transform:uppercase; font-size:.8rem; color:rgba(255,220,225,.75); }
  @keyframes latido { 50% { transform:scale(1.05); } }

  #linea { position:fixed; left:0; right:0; bottom:0; height:3px; z-index:90; background:rgba(255,255,255,.08); opacity:0; transition:opacity 1.5s; }
  #linea.on { opacity:1; }
  #lineaFill { height:100%; width:0; background:linear-gradient(90deg, #ff3b4e, #ff9a8a); box-shadow:0 0 14px #ff3b4e; position:relative; }
  #lineaFill::after { content:''; position:absolute; right:-6px; top:50%; width:12px; height:12px; margin-top:-6px; border-radius:50%; background:#fff; box-shadow:0 0 16px 4px #ff3b4e; }
  #linea.listo #lineaFill { background:linear-gradient(90deg, #ff3b4e, #7ff3ff); box-shadow:0 0 20px #7ff3ff; }

  #controles { position:fixed; bottom:max(28px, env(safe-area-inset-bottom) + 18px); left:0; right:0; z-index:100; display:flex; flex-wrap:wrap; gap:12px; justify-content:center; padding:0 12px;
    opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity 1.2s, transform 1.2s, visibility 0s 1.2s; }
  #controles.on { opacity:1; visibility:visible; transform:none; transition:opacity 1.2s, transform 1.2s; }
  .btn { padding:13px 26px; border-radius:50px; color:#fff; text-decoration:none; font-weight:500; font-size:.92rem; letter-spacing:.04em; background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 0 24px rgba(255,59,78,.25); transition:background .3s, transform .3s, box-shadow .3s; }
  @media (hover:hover) { .btn:hover { background:rgba(255,59,78,.85); transform:scale(1.07); box-shadow:0 0 36px rgba(255,59,78,.7); } }
  .btn.suave { border-color:rgba(255,255,255,.25); box-shadow:none; }
  #btnSecreto { display:none; border-color:#7ff3ff; box-shadow:0 0 30px rgba(127,243,255,.6), inset 0 0 18px rgba(255,59,168,.4); animation:secreto 1.1s ease-in-out infinite alternate; }
  @keyframes secreto { to { transform:scale(1.1); box-shadow:0 0 46px rgba(127,243,255,.9), inset 0 0 22px rgba(255,59,168,.6); } }
</style>
</head>
<body>

<audio id="musicaRojo" loop preload="auto"><source src="videos/musicarojo.mp3" type="audio/mpeg"></audio>

<div id="lienzo"></div>
<div id="vineta"></div>

  <a href="hilo_rojo.html" class="btn">🧵 Volver</a>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ============ Configuración ============ */
const esCelular = innerWidth < 768 || (matchMedia('(pointer: coarse)').matches && innerWidth < 1100);
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ss = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const smooth = (k, dt) => 1 - Math.exp(-k * dt);
const T_PORTAL = 326;      // segundos hasta que se abre el portal secreto (5:26)
const T_CONTROLES = 5.8;   // segundos hasta mostrar los botones
const VEL = 520;           // velocidad con que los recuerdos se acercan

const audio = $('musicaRojo'), statusTxt = $('musicStatus'), btnSecreto = $('btnSecreto');
const todos = [];
for (let i = 1; i <= 40; i++) todos.push({ tipo: 'img', src: `fotos/foto${i}.jpg` });
for (let j = 1; j <= 10; j++) todos.push({ tipo: 'video', src: `videos/video${j}.mp4` });
function mezclar(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; }

/* ============ Escena ============ */
const renderer = new THREE.WebGLRenderer({ antialias: !esCelular, powerPreference: 'high-performance' });
let pr = Math.min(devicePixelRatio, esCelular ? 1.5 : 2);
renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); $('lienzo').appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 1, 12000); camera.rotation.order = 'YXZ';
let composer = null;
if (!esCelular) {
  composer = new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene, camera));
  composer.addPass(new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .7, .6, .55));
}
const U = { uTime: { value: 0 }, uPR: { value: pr } }; // uniformes compartidos
const mezclaAdit = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };

/* Cielo del atardecer (kataware-doki) */
const cielo = new THREE.Mesh(new THREE.SphereGeometry(9000, 32, 20), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, uniforms: { uTime: U.uTime },
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `varying vec3 vD; uniform float uTime;
    float h(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7))) * 43758.5453); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    void main(){
      vec3 d = normalize(vD); float y = d.y;
      vec3 top=vec3(.025,.01,.09), mid=vec3(.17,.05,.30), low=vec3(.52,.13,.38), hor=vec3(1.,.40,.34);
      vec3 c = mix(low, mid, smoothstep(0., .35, y)); c = mix(c, top, smoothstep(.25, .95, y));
      c = mix(c, vec3(.04,.01,.09), smoothstep(0., -.45, y));
      c += hor * exp(-abs(y) * 6.) * (.5 + .12 * sin(uTime * .3));
      float a = atan(d.x, -d.z);
      float q = n(vec2(a * 2. + uTime * .02, y * 5.)) * .6 + n(vec2(a * 5. - uTime * .03, y * 9.)) * .4;
      c += mix(vec3(.45,.1,.55), vec3(1.,.4,.45), q) * q * .2 * smoothstep(-.15, .5, y);
      gl_FragColor = vec4(c, 1.);
    }`
}));
cielo.renderOrder = -10; scene.add(cielo);

/* Partículas que viajan hacia la cámara (estrellas y motas de luz) */
function capaParticulas(n, size, speed, color, rango = 4200, ancho = 2600) {
  const pos = new Float32Array(n * 3), r = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos.set([(Math.random() - .5) * ancho * 2, (Math.random() - .5) * ancho * 1.4, -Math.random() * rango], i * 3); r[i] = Math.random(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aR', new THREE.BufferAttribute(r, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({ ...mezclaAdit,
    uniforms: { uTime: U.uTime, uPR: U.uPR, uSize: { value: size }, uSpeed: { value: speed }, uRange: { value: rango }, uColor: { value: new THREE.Color(color) } },
    vertexShader: `attribute float aR; uniform float uTime,uPR,uSize,uSpeed,uRange; varying float vA;
      void main(){ float d = mod(-position.z - uTime * uSpeed, uRange); vec4 mv = modelViewMatrix * vec4(position.xy, -d, 1.); gl_Position = projectionMatrix * mv;
        vA = smoothstep(uRange, uRange * .7, d) * smoothstep(10., 160., d) * (.55 + .45 * sin(uTime * 2. + aR * 40.));
        gl_PointSize = clamp(uSize * uPR * (500. / d) * (.6 + aR * .9), 1., 28.); }`,
    fragmentShader: 'uniform vec3 uColor; varying float vA; void main(){ float r = length(gl_PointCoord - .5) * 2.; if(r > 1.) discard; gl_FragColor = vec4(uColor, pow(1. - r, 1.7) * vA); }'
  }));
  p.frustumCulled = false; p.renderOrder = -5; scene.add(p); return p;
}
capaParticulas(esCelular ? 1100 : 2600, 2.4, 520, 0xdfe6ff);
capaParticulas(esCelular ? 110 : 260, 7, 260, 0xffb089, 4200, 1800);   // motas cálidas
capaParticulas(esCelular ? 70 : 170, 9, 180, 0xff7aa8, 4200, 1500);    // polvo rosado

/* El hilo rojo: dos hebras trenzadas + una hebra suelta, con luz que viaja */
const camino = (d, t) => [Math.sin(t * 1.3 + d * .0075) * 85, Math.cos(t * .9 + d * .011) * 55];
function hilo(n, base, intensidad) {
  const z = new Float32Array(n * 3), s = new Float32Array(n * 3), pos = new Float32Array(n * 3 * 3);
  const total = n * 3, aZ = new Float32Array(total), aS = new Float32Array(total);
  for (let k = 0; k < 3; k++) for (let i = 0; i < n; i++) { aZ[k * n + i] = 20 + (i / n) * 2600; aS[k * n + i] = k; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(total * 3), 3));
  g.setAttribute('aZ', new THREE.BufferAttribute(aZ, 1)); g.setAttribute('aS', new THREE.BufferAttribute(aS, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({ ...mezclaAdit,
    uniforms: { uTime: U.uTime, uPR: U.uPR, uBase: { value: base }, uInt: { value: intensidad } },
    vertexShader: `attribute float aZ, aS; uniform float uTime,uPR,uBase; varying float vI, vF, vS;
      void main(){
        float d = aZ;
        vec2 c = vec2(sin(uTime * 1.3 + d * .0075) * 85., cos(uTime * .9 + d * .011) * 55.);
        float ang = d * .012 - uTime * 1.6 + aS * 3.14159, rad = (aS < 1.5 ? 15. : 0.) * (1. + .3 * sin(d * .02 + uTime));
        vec4 mv = modelViewMatrix * vec4(c + vec2(cos(ang), sin(ang)) * rad, -d, 1.); gl_Position = projectionMatrix * mv;
        float pulse = pow(.5 + .5 * sin(d * .012 - uTime * 3.2), 5.);
        vI = .55 + 1.7 * pulse; vS = aS; vF = smoothstep(2600., 1700., d) * smoothstep(15., 130., d);
        gl_PointSize = clamp(uBase * uPR * (1. + pulse) * (520. / -mv.z), 1.5, 90.); }`,
    fragmentShader: `uniform float uInt; varying float vI, vF, vS;
      void main(){ float r = length(gl_PointCoord - .5) * 2.; if(r > 1.) discard;
        float core = smoothstep(.5, 0., r), glow = pow(1. - r, 2.4);
        vec3 red = vS > 1.5 ? vec3(1., .35, .3) : vec3(1., .07, .12);
        gl_FragColor = vec4((red * glow * 1.3 + vec3(1., .8, .7) * core * .7) * vI * uInt, glow * vF); }`
  }));
  p.frustumCulled = false; p.renderOrder = 5; scene.add(p);
}
hilo(esCelular ? 520 : 950, 6, 1); hilo(esCelular ? 260 : 420, 16, .22);

/* Anillos de tiempo: línea de tiempo que se acerca */
const anillos = [];
for (let i = 0; i < 8; i++) {
  const m = new THREE.Mesh(new THREE.RingGeometry(1, 1.022, 128), new THREE.MeshBasicMaterial({ ...mezclaAdit, color: i % 2 ? 0xff7aa8 : 0xff4d5e, opacity: .14, side: THREE.DoubleSide }));
  m.scale.setScalar(420 + Math.random() * 260); m.renderOrder = -3; m.userData.d = (i / 8) * 2600; scene.add(m); anillos.push(m);
}

/* Cometas que cruzan el cielo */
function texCometa() {
  const c = document.createElement('canvas'); c.width = 256; c.height = 16; const g = c.getContext('2d');
  const gr = g.createLinearGradient(0, 0, 256, 0); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(.85, 'rgba(255,255,255,.85)'); gr.addColorStop(1, 'rgba(255,255,255,1)');
  g.fillStyle = gr; g.fillRect(0, 0, 256, 16);
  g.globalCompositeOperation = 'destination-in'; const v = g.createLinearGradient(0, 0, 0, 16); v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(.5, 'rgba(0,0,0,1)'); v.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = v; g.fillRect(0, 0, 256, 16); return new THREE.CanvasTexture(c);
}
const cometas = [0, 1].map(() => { const s = new THREE.Sprite(new THREE.SpriteMaterial({ ...mezclaAdit, map: texCometa(), color: 0xffd9b0, opacity: 0 })); s.scale.set(1100, 34, 1); s.userData = { t: 0, dur: 1, v: new THREE.Vector3(), p: new THREE.Vector3() }; s.renderOrder = -6; scene.add(s); return s; });
function lanzarCometa(c) {
  const lado = Math.random() < .5 ? -1 : 1, u = c.userData;
  u.p.set(-lado * 3800, 1300 + Math.random() * 900, -3000); u.v.set(lado * (3800 + Math.random() * 800), -(1300 + Math.random() * 600), 0);
  u.t = 1e-3; u.dur = 2 + Math.random() * .6; c.material.rotation = Math.atan2(u.v.y, u.v.x); c.material.color.setHex([0xffd9b0, 0xffb3c8, 0xfff2d6][Math.random() * 3 | 0]);
}

/* ============ Recuerdos: portales con bordes suaves y formas distintas ============ */
const vertRec = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }';
const fragRec = `uniform sampler2D uMap; uniform float uShape,uOpacity,uTime,uSeed,uFeather,uAspect; uniform vec2 uCover; uniform vec3 uTint; varying vec2 vUv;
  float sdBox(vec2 p, vec2 b, float r){ vec2 d = abs(p) - b + r; return length(max(d,0.)) + min(max(d.x,d.y),0.) - r; }
  float sdHeart(vec2 p){ p.x = abs(p.x); if(p.y + p.x > 1.) return sqrt(dot(p - vec2(.25,.75), p - vec2(.25,.75))) - sqrt(2.) / 4.;
    return sqrt(min(dot(p - vec2(0.,1.), p - vec2(0.,1.)), dot(p - .5 * max(p.x + p.y, 0.), p - .5 * max(p.x + p.y, 0.)))) * sign(p.x - p.y); }
  float sdHex(vec2 p, float r){ const vec3 k = vec3(-.866025404, .5, .577350269); p = abs(p); p -= 2. * min(dot(k.xy, p), 0.) * k.xy; p -= vec2(clamp(p.x, -k.z * r, k.z * r), r); return length(p) * sign(p.y); }
  float shape(vec2 q){
    float hw = 1.2 * uAspect - .35;
    if(uShape < .5) return length(q) - .85;
    if(uShape < 1.5) return sdBox(q, vec2(hw, .85), .25);
    if(uShape < 2.5){ vec2 p = q / .85 * .75 + vec2(0., .55); return sdHeart(p) * .85 / .75; }
    if(uShape < 3.5) return min(sdBox(q - vec2(0., -.25), vec2(hw, .6), .03), length(q - vec2(0., .35)) - hw);
    if(uShape < 4.5) return sdHex(q, .78);
    if(uShape < 5.5){ float an = atan(q.y, q.x); return length(q) - (.78 + .07 * sin(an * 3. + uSeed + uTime * .8) + .05 * sin(an * 5. - uTime * 1.1 + uSeed * 2.3)); }
    return length(q - vec2(clamp(q.x, -(hw - .8), hw - .8), 0.)) - .8;
  }
  void main(){
    vec2 q = (vUv - .5) * 2. * vec2(uAspect, 1.) * 1.2;
    float d = shape(q), f = uFeather;
    float a = 1. - smoothstep(-f, .02, d);
    float edge = clamp(-d / (f + .001), 0., 1.);
    vec2 uv = (vUv - .5) * uCover + .5, off = normalize(vUv - .5 + 1e-4) * (1. - edge) * .012;
    vec3 m = vec3(texture2D(uMap, uv + off).r, texture2D(uMap, uv).g, texture2D(uMap, uv - off).b);
    vec3 rim = mix(uTint, vec3(1., .85, .75), .35 + .35 * sin(uTime * 1.3 + uSeed * 3.));
    float glowRim = exp(-pow((d + f * .25) / (.045 + f * .12), 2.));
    float halo = exp(-max(d, 0.) * 4.2) * .55;
    vec3 col = mix(rim * .8, m, a) + rim * glowRim * .7;
    float alpha = clamp(max(a, halo * .6) + glowRim * .5, 0., 1.) * uOpacity;
    if(alpha < .004) discard;
    gl_FragColor = vec4(col, alpha);
  }`;
const FORMAS = [{ id: 0, a: [1] }, { id: 1, a: [1.33, .78] }, { id: 2, a: [1] }, { id: 3, a: [.78] }, { id: 4, a: [1] }, { id: 5, a: [1] }, { id: 6, a: [1.9] }];
const TINTES = [[1, .22, .3], [1, .22, .3], [1, .45, .7], [1, .55, .35], [.85, .4, 1], [1, .8, .45]];
const recientes = [], memorias = [];
function elegirForma() {
  let f; do { f = FORMAS[Math.random() * FORMAS.length | 0]; } while (recientes.includes(f.id)); recientes.push(f.id); if (recientes.length > 3) recientes.shift(); return f;
}

/* Precarga: siempre hay recuerdos listos, así nada se traba al aparecer */
let orden = [], ord = 0, pendientes = 0, fallos = 0; const listos = [];
const MAXTEX = esCelular ? 768 : 1280;
function sigDef() { if (ord >= orden.length) { orden = mezclar([...todos]); ord = 0; } return orden[ord++]; }
function placeholder() {
  const c = document.createElement('canvas'); c.width = c.height = 256; const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 256, 256);
  gr.addColorStop(0, '#ff3b4e'); gr.addColorStop(1, '#7a3cff'); g.fillStyle = gr; g.fillRect(0, 0, 256, 256); g.font = '120px Arial'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('💗', 128, 134);
  return { tex: new THREE.CanvasTexture(c), aspect: 1 };
}
function precargar() {
  while (pendientes + listos.length < 3 && fallos < 400) {
    if (fallos > 60 && !listos.length) { listos.push(placeholder()); continue; }
    const d = sigDef(); pendientes++;
    if (d.tipo === 'img') {
      const im = new Image(); im.decoding = 'async';
      im.onload = () => {
        const k = Math.min(1, MAXTEX / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); const t = new THREE.CanvasTexture(c); t.minFilter = THREE.LinearFilter; t.generateMipmaps = false;
        listos.push({ tex: t, aspect: im.width / im.height }); pendientes--; precargar();
      };
      im.onerror = () => { fallos++; pendientes--; precargar(); }; im.src = d.src;
    } else {
      const v = document.createElement('video'); v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
      v.onloadeddata = () => { v.onloadeddata = null; const t = new THREE.VideoTexture(v); t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; listos.push({ tex: t, aspect: v.videoWidth / v.videoHeight, video: v }); pendientes--; precargar(); };
      v.onerror = () => { fallos++; pendientes--; precargar(); }; v.src = d.src; v.load();
    }
  }
}

const geoPlano = new THREE.PlaneGeometry(1, 1);
function aparecer() {
  const m = listos.shift(); precargar(); if (!m) return;
  const f = elegirForma(), A = f.a[Math.random() * f.a.length | 0], central = Math.random() < .22; // algunos pasan justo por el centro: atraviesas el portal
  const H = (300 + Math.random() * 130) * (central ? 1.35 : 1), cover = m.aspect > A ? [A / m.aspect, 1] : [1, m.aspect / A], t = TINTES[Math.random() * TINTES.length | 0];
  const mat = new THREE.ShaderMaterial({ transparent: true, depthWrite: false, vertexShader: vertRec, fragmentShader: fragRec, uniforms: {
    uMap: { value: m.tex }, uShape: { value: f.id }, uOpacity: { value: 0 }, uTime: U.uTime, uSeed: { value: Math.random() * 20 }, uFeather: { value: central ? .1 : .12 + Math.random() * .26 },
    uAspect: { value: A }, uCover: { value: new THREE.Vector2(cover[0], cover[1]) }, uTint: { value: new THREE.Vector3(t[0], t[1], t[2]) } } });
  const mesh = new THREE.Mesh(geoPlano, mat); mesh.scale.set(H * A, H, 1); scene.add(mesh);
  const lado = Math.random() < .5 ? -1 : 1, bx = central ? (Math.random() - .5) * 120 : lado * (160 + Math.random() * 560), by = central ? (Math.random() - .5) * 90 : (Math.random() - .5) * 700;
  if (m.video) m.video.play().catch(() => {});
  memorias.push({ mesh, m, bx, by, z: -2400, age: 0, ph: Math.random() * 6.28, yaw: -bx * .00035, roll: (Math.random() - .5) * .3, spin: (Math.random() - .5) * .16 });
}
function quitar(i) {
  const o = memorias[i]; scene.remove(o.mesh); o.mesh.material.dispose(); o.m.tex.dispose();
  if (o.m.video) { o.m.video.pause(); o.m.video.removeAttribute('src'); o.m.video.load(); } memorias.splice(i, 1);
}

/* ============ Audio, inicio y portal secreto ============ */
let relojIniciado = false, inicioMs = 0, portalAbierto = false, t0 = performance.now();
function iniciarExperiencia() {
  if (!audio.paused) return;
  audio.volume = 0;
  audio.play().then(() => {
    const fade = setInterval(() => { audio.volume = Math.min(1, audio.volume + .05); if (audio.volume >= 1) clearInterval(fade); }, 100);
    statusTxt.innerText = 'GUIANDO EL DESTINO 🎶'; statusTxt.style.color = '#ff6b78'; $('inicio').classList.add('fuera'); $('linea').classList.add('on');
    if (!relojIniciado) { relojIniciado = true; inicioMs = performance.now(); }
  }).catch(() => {});
}
addEventListener('click', iniciarExperiencia);
addEventListener('touchstart', iniciarExperiencia, { passive: true });
document.addEventListener('visibilitychange', () => { if (document.hidden) audio.pause(); else if (relojIniciado) audio.play().catch(() => {}); });

/* ============ Dirección con el cursor / el dedo ============ */
const ptr = { x: 0, y: 0, tx: 0, ty: 0 };
function apuntar(e) { ptr.tx = (e.clientX / innerWidth - .5) * 2; ptr.ty = (e.clientY / innerHeight - .5) * 2; }
addEventListener('pointermove', apuntar); addEventListener('pointerdown', apuntar);

/* ============ Bucle ============ */
const reloj = new THREE.Clock(); let t = 0, proximo = 1.2, proxCometa = 3, fpsAcc = 0, fpsN = 0, controlesOn = false;
function animar() {
  requestAnimationFrame(animar);
  const dt = Math.min(reloj.getDelta(), .05); t += dt; U.uTime.value = t;

  // Calidad adaptable
  fpsAcc += dt; if (++fpsN >= 90) {
    if (fpsAcc / fpsN > .027 && pr > 1) { pr = Math.max(1, pr - .25); U.uPR.value = pr; renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); if (composer) { composer.setPixelRatio(pr); composer.setSize(innerWidth, innerHeight); } }
    fpsAcc = fpsN = 0;
  }

  // Cámara: el destino se guía con el cursor
  const k = smooth(2.2, dt); ptr.x += (ptr.tx - ptr.x) * k; ptr.y += (ptr.ty - ptr.y) * k;
  camera.rotation.set(-ptr.y * .17, -ptr.x * .3, Math.sin(t * .25) * .035); camera.position.set(ptr.x * 55, -ptr.y * 32, 0);
  cielo.position.copy(camera.position);

  // Recuerdos
  proximo -= dt; if (proximo <= 0 && listos.length && memorias.length < 6) { aparecer(); proximo = .95 + Math.random() * .7; }
  for (let i = memorias.length - 1; i >= 0; i--) {
    const o = memorias[i]; o.age += dt; o.z += VEL * dt;
    o.mesh.position.set(o.bx + Math.sin(o.age * .8 + o.ph) * 38, o.by + Math.cos(o.age * .6 + o.ph) * 28, o.z);
    o.mesh.rotation.set(0, o.yaw, o.roll + o.age * o.spin);
    o.mesh.material.uniforms.uOpacity.value = ss(-2400, -1700, o.z) * (1 - ss(-420, -110, o.z));
    if (o.z > -60) quitar(i);
  }

  // Anillos de tiempo
  anillos.forEach(r => {
    const u = r.userData; u.d -= VEL * .55 * dt; if (u.d < 40) u.d += 2600;
    const c = camino(u.d, t); r.position.set(c[0], c[1], -u.d); r.material.opacity = .16 * ss(2600, 1900, u.d) * ss(40, 260, u.d);
  });

  // Cometas
  proxCometa -= dt; if (proxCometa <= 0) { const c = cometas.find(c => c.userData.t <= 0); if (c) lanzarCometa(c); proxCometa = 5 + Math.random() * 7; }
  cometas.forEach(c => {
    const u = c.userData; if (u.t <= 0) return; u.t += dt; const p = u.t / u.dur;
    if (p >= 1) { u.t = 0; c.material.opacity = 0; return; }
    c.position.copy(u.p).addScaledVector(u.v, u.t); c.material.opacity = Math.pow(Math.sin(Math.PI * p), .7) * .9;
  });

  // Línea de tiempo y portal
  if (relojIniciado) {
    const el = (performance.now() - inicioMs) / 1000; $('lineaFill').style.width = (Math.min(1, el / T_PORTAL) * 100) + '%';
    if (el >= T_PORTAL && !portalAbierto) {
      portalAbierto = true; btnSecreto.style.display = 'inline-block'; $('linea').classList.add('listo');
      statusTxt.innerText = '¡UN PORTAL SE HA ABIERTO EN EL TIEMPO! ✨'; statusTxt.style.color = '#7ff3ff'; statusTxt.style.boxShadow = '0 0 18px rgba(127,243,255,.5)';
    }
  }
  if (!controlesOn && t > T_CONTROLES) { controlesOn = true; $('controles').classList.add('on'); }

  composer ? composer.render() : renderer.render(scene, camera);
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); if (composer) composer.setSize(innerWidth, innerHeight);
});

precargar(); animar();
</script>
