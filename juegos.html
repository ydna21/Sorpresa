<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nuestra Sala de Juegos</title>
<style>
  body {
    margin: 0; background: black; font-family: 'Courier New', monospace;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; color: white; text-align: center;
  }
  h1 { color: #ff69b4; text-shadow: 0 0 15px #ff69b4; margin-bottom: 40px; }
  
  .games-container { 
    display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; 
    max-width: 900px; padding: 20px; 
  }
  
  .game-card {
    background: rgba(255, 105, 180, 0.1); border: 2px solid #ff69b4;
    border-radius: 15px; padding: 20px; width: 220px;
    box-shadow: 0 0 15px rgba(255, 105, 180, 0.3); transition: 0.3s;
    cursor: pointer; text-decoration: none; color: white;
    display: flex; flex-direction: column; align-items: center;
  }
  
  .game-card:hover { 
    transform: translateY(-10px); 
    box-shadow: 0 0 25px #ff69b4; 
    background: rgba(255, 105, 180, 0.3); 
  }
  
  .game-icon { font-size: 4rem; margin-bottom: 15px; }
  .game-title { font-size: 1.3rem; font-weight: bold; margin-bottom: 10px; color: #ff69b4; }
  .game-desc { font-size: 0.95rem; opacity: 0.8; }
  
  .btn-regresar {
    margin-top: 40px; padding: 12px 30px; font-size: 1.1rem;
    background: #333; color: white; border: none; border-radius: 10px;
    cursor: pointer; text-decoration: none; transition: 0.3s;
  }
  .btn-regresar:hover { background: #555; }
</style>
</head>
<body>

  <h1>🎮 Nuestra Sala de Juegos 🎮</h1>
  
  <div class="games-container">
    <!-- Juego 1: Rompecabezas (Ya lo tenemos) -->
    <a href="juegos/rompecabezas.html" class="game-card">
      <div class="game-icon">🧩</div>
      <div class="game-title">Rompecabezas</div>
      <div class="game-desc">Arma nuestra foto especial</div>
    </a>
    
    <!-- Juego 2: Memoria (Próximamente) -->
    <a href="juegos/memoria.html" class="game-card">
      <div class="game-icon">🎴</div>
      <div class="game-title">Memoria de Amor</div>
      <div class="game-desc">Encuentra los pares de nuestras fotos</div>
    </a>

    <!-- Juego 3: Atrapa Corazones (Próximamente) -->
    <a href="juegos/corazones.html" class="game-card">
      <div class="game-icon">💖</div>
      <div class="game-title">Atrapa Corazones</div>
      <div class="game-desc">Demuestra tus reflejos por mi amor</div>
    </a>
  </div>
  
  <a href="index.html" class="btn-regresar">⬅️ Regresar al Inicio</a>

</body>
</html>
