<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Juegos</title>
<style>
  body {
    margin: 0;
    background: black;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: white;
  }
  
  h2 {
    color: #ff69b4;
    text-shadow: 0 0 10px #ff69b4;
    text-align: center;
    margin-bottom: 20px;
  }

  #puzzleCanvas {
    border: 4px solid #ff69b4;
    border-radius: 10px;
    box-shadow: 0 0 20px #ff69b4;
    max-width: 90%;
  }

  .btn-regresar {
    margin-top: 20px;
    padding: 12px 25px;
    font-size: 1.2rem;
    background: #ff69b4;
    color: white;
    border: none;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 0 0 15px #ff69b4;
  }
</style>
</head>
<body>

  <h2>🧩 Resuelve el Rompecabezas 🧩</h2>
  
  <canvas id="puzzleCanvas" width="300" height="300"></canvas>
  
  <!-- Botón para regresar a la pantalla principal -->
  <button class="btn-regresar" onclick="window.history.back()">⬅️ Regresar</button>

  <script>
    const canvas = document.getElementById("puzzleCanvas");
    const ctx = canvas.getContext("2d");
    const size = 300;
    const rows = 3, cols = 3;
    const pieceSize = size / rows;
    const img = new Image();
    
    // Asegúrate de tener esta imagen en la misma carpeta
    img.src = "puzzle.jpg"; 

    let board = []; 
    let emptyIndex = 8; 

    img.onload = function(){
      board = [];
      for(let i=0; i<rows*cols; i++) board.push(i);
      shuffleBoard();
      drawPuzzle();
    };

    function shuffleBoard() {
      for (let i = 0; i < 100; i++) {
        const neighbors = getNeighbors(emptyIndex);
        const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
        swap(emptyIndex, randomNeighbor);
        emptyIndex = randomNeighbor;
      }
    }

    function getNeighbors(idx) {
      const r = Math.floor(idx / cols);
      const c = idx % cols;
      const neighbors = [];
      if (r > 0) neighbors.push(idx - cols); 
      if (r < rows - 1) neighbors.push(idx + cols); 
      if (c > 0) neighbors.push(idx - 1); 
      if (c < cols - 1) neighbors.push(idx + 1); 
      return neighbors;
    }

    function drawPuzzle(){
      ctx.clearRect(0, 0, size, size);
      board.forEach((pieceOriginalIndex, currentPosIndex) => {
        if (pieceOriginalIndex === rows * cols - 1) return;
        const drawRow = Math.floor(currentPosIndex / cols);
        const drawCol = currentPosIndex % cols;
        const imgRow = Math.floor(pieceOriginalIndex / cols);
        const imgCol = pieceOriginalIndex % cols;
        const imgSize = Math.min(img.width, img.height);
        const sx = (img.width - imgSize) / 2;
        const sy = (img.height - imgSize) / 2;
        
        ctx.drawImage(
          img,
          sx + imgCol * (imgSize/cols), sy + imgRow * (imgSize/rows), (imgSize/cols), (imgSize/rows),
          drawCol * pieceSize, drawRow * pieceSize, pieceSize, pieceSize
        );
        ctx.strokeStyle = "#ff69b4";
        ctx.strokeRect(drawCol * pieceSize, drawRow * pieceSize, pieceSize, pieceSize);
      });
    }

    function handleClick(x, y) {
      const col = Math.floor(x / pieceSize);
      const row = Math.floor(y / pieceSize);
      const clickedIndex = row * cols + col;
      const neighbors = getNeighbors(emptyIndex);
      
      if (neighbors.includes(clickedIndex)) {
        swap(emptyIndex, clickedIndex);
        emptyIndex = clickedIndex;
        drawPuzzle();
        checkWin();
      }
    }

    function swap(i, j) {
      [board[i], board[j]] = [board[j], board[i]];
    }

    // AQUI SE MODIFICÓ: Ya no genera el botón "Ir al Bosque", solo manda el mensaje de felicitaciones
    function checkWin() {
      const isWin = board.every((val, index) => val === index);
      if (isWin) {
        setTimeout(() => {
          alert("🎉 ¡Felicidades mi amor! Completaste el rompecabezas 💖");
        }, 200);
      }
    }

    canvas.onmousedown = (e) => { handleClick(e.offsetX, e.offsetY); };
    canvas.ontouchstart = (e) => {
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      handleClick(e.touches[0].clientX - rect.left, e.touches[0].clientY - rect.top);
    };
  </script>
</body>
</html>
