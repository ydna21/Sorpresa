<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#07061a">
<title>Para mi graduada 🎓✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --gold:#ffd76a; --rose:#ffa9c9; --cream:#fff4dc; --glass:rgba(20,10,30,.55); --line:rgba(255,215,106,.4); --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:#07061a; overflow:hidden; font-family:var(--sans); color:#fff; -webkit-font-smoothing:antialiased; }
  #lienzo { position:fixed; inset:0; z-index:1; touch-action:none; }
  #lienzo canvas { display:block; }
  #vineta { position:fixed; inset:0; z-index:2; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(7,6,26,.65) 100%); }
  #flash { position:fixed; inset:0; z-index:60; pointer-events:none; opacity:0; background:radial-gradient(circle,#fff 0%,#ffe9b0 50%,transparent 85%); transition:opacity 1.6s ease; }
  #flash.on { opacity:1; transition:opacity .2s ease; }

  /* Pantalla de inicio */
  #inicio { position:fixed; inset:0; z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:28px; text-align:center;
    background:radial-gradient(ellipse at 50% 45%, #2a1650 0%, #0c0824 60%, #07061a 100%); transition:opacity 1.6s ease, transform 1.6s ease; }
  #inicio.fuera { opacity:0; transform:scale(1.08); pointer-events:none; }
  #inicio .cap { font-size:4rem; filter:drop-shadow(0 0 26px rgba(255,215,106,.8)); animation:flota 3s ease-in-out infinite; }
  #inicio h1 { margin:0; font:italic 600 clamp(2.2rem,7vw,4rem)/1.1 var(--serif); color:var(--gold); text-shadow:0 0 34px rgba(255,170,60,.7); }
  #inicio p { margin:0; font-weight:300; letter-spacing:.2em; text-transform:uppercase; font-size:.8rem; color:rgba(255,236,200,.7); }
  #btnComenzar { margin-top:8px; padding:16px 46px; border-radius:60px; cursor:pointer; font:500 1rem var(--sans); letter-spacing:.18em; text-transform:uppercase; color:#2a1400;
    background:linear-gradient(135deg,#ffe29a,#ffb84a); border:none; box-shadow:0 0 44px rgba(255,184,74,.55); animation:latido 2.6s ease-in-out infinite; }
  @keyframes flota { 50% { transform:translateY(-10px) rotate(-4deg); } }
  @keyframes latido { 50% { transform:scale(1.06); } }

  /* Textos de la introducción */
  #lineas { position:fixed; left:50%; top:50%; z-index:10; transform:translate(-50%,-46%); width:min(760px,88vw); text-align:center; pointer-events:none; opacity:0;
    font:italic 500 clamp(1.5rem,4.6vw,2.6rem)/1.45 var(--serif); color:var(--cream); text-shadow:0 0 28px rgba(255,190,90,.7), 0 2px 16px rgba(0,0,0,.8); transition:opacity 1.2s ease, transform 1.2s ease; }
  #lineas.on { opacity:1; transform:translate(-50%,-50%); }
  #saltar { position:fixed; right:16px; bottom:max(18px, env(safe-area-inset-bottom) + 10px); z-index:30; display:none; padding:8px 16px; border-radius:30px; cursor:pointer; font:300 .8rem var(--sans); letter-spacing:.1em; color:rgba(255,236,200,.7);
    background:var(--glass); border:1px solid rgba(255,255,255,.15); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }

  /* Título principal */
  #titulo { position:fixed; top:max(36px, env(safe-area-inset-top) + 22px); left:0; right:0; z-index:10; text-align:center; pointer-events:none; padding:0 14px; filter:drop-shadow(0 0 22px rgba(255,170,60,.65)); }
#titulo h2 { margin:0; font:italic 600 clamp(2.2rem,7.5vw,4.6rem)/1.05 var(--serif); background:linear-gradient(180deg,#fff6d6 10%,#ffd76a 55%,#ffa62b 100%); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #titulo h2 span { display:inline-block; opacity:0; transform:translateY(24px) scale(.8); animation:letra .9s cubic-bezier(.2,.9,.2,1.2) forwards; }
  @keyframes letra { to { opacity:1; transform:none; } }
  #titulo p { margin:10px 0 0; font:300 clamp(.95rem,2.6vw,1.25rem) var(--sans); letter-spacing:.14em; color:var(--cream); text-shadow:0 2px 14px rgba(0,0,0,.8); opacity:0; animation:letra 1.4s ease forwards 2.2s; }

  #pista { position:fixed; top:max(128px, env(safe-area-inset-top) + 112px); left:50%; transform:translateX(-50%); z-index:12; white-space:nowrap; opacity:0; pointer-events:none; padding:9px 20px; border-radius:30px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); font:300 .85rem var(--sans); letter-spacing:.04em; color:var(--cream); transition:opacity 1.2s; }
  #pista.on { opacity:1; }
  @media (max-width:520px) { #pista { top:auto; bottom:max(86px, env(safe-area-inset-bottom) + 74px); white-space:normal; width:max-content; max-width:86vw; text-align:center; } }

  #botones { position:fixed; bottom:max(22px, env(safe-area-inset-bottom) + 12px); left:0; right:0; z-index:30; display:flex; justify-content:center; gap:12px; flex-wrap:wrap; padding:0 12px;
    opacity:0; visibility:hidden; transform:translateY(10px); transition:opacity 1.2s, transform 1.2s, visibility 0s 1.2s; }
  #botones.on { opacity:1; visibility:visible; transform:none; transition:opacity 1.2s, transform 1.2s; }
  .btn { padding:12px 22px; border-radius:50px; cursor:pointer; font:500 .9rem var(--sans); letter-spacing:.04em; color:var(--gold); text-decoration:none; background:var(--glass); border:1px solid var(--line);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:all .3s; }
  @media (hover:hover) { .btn:hover { background:rgba(255,184,74,.85); color:#2a1400; box-shadow:0 0 30px rgba(255,184,74,.7); transform:scale(1.06); } }

  /* Carta */
  #carta { position:fixed; top:50%; left:50%; z-index:200; width:min(540px,90vw); max-height:84vh; overflow:auto; padding:clamp(26px,6vw,46px); text-align:center; border-radius:28px; visibility:hidden; opacity:0; transform:translate(-50%,-46%) scale(.97);
    background:linear-gradient(160deg, rgba(46,20,60,.78), rgba(14,8,28,.85)); border:1px solid var(--line); backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px); box-shadow:0 0 90px rgba(255,170,60,.3), inset 0 1px 0 rgba(255,255,255,.15);
    transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1), visibility 0s 1.2s; }
  #carta.abierta { visibility:visible; opacity:1; transform:translate(-50%,-50%); transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.8,.2,1); }
  #carta h3 { margin:0 0 20px; font:italic 600 clamp(1.9rem,6vw,2.6rem)/1.1 var(--serif); color:var(--gold); text-shadow:0 0 22px rgba(255,170,60,.6); }
  #carta p { margin:0 0 15px; font-weight:300; font-size:clamp(.98rem,2.8vw,1.1rem); line-height:1.85; color:#fff3e4; }
  #carta .firma { margin-top:24px; text-align:right; font:italic 600 1.7rem var(--serif); color:var(--rose); }
  #carta .btn { margin-top:10px; }
</style>
</head>
<body>

<div id="lienzo"></div>
<div id="vineta"></div>
<div id="flash"></div>

<div id="lineas"></div>
<div id="titulo"></div>
<div id="pista"></div>
<div id="saltar">saltar ›</div>

<div id="botones">
  <button class="btn" id="btnCarta">💌 Mensaje para ti</button>
  <button class="btn" id="btnRepetir">🔄 Repetir</button>
  <a class="btn" href="index.html">🏠 Inicio</a>
</div>

<div id="carta" role="dialog" aria-label="Mensaje"></div>

<div id="inicio">
  <div class="cap">🎓</div>
  <h1>Para mi graduada</h1>
  <p>Una sorpresa hecha para ti · sube el volumen 🎧</p>
  <button id="btnComenzar">Comenzar ✨</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ================= PERSONALIZA AQUÍ ================= */
const CONFIG = {
  nombre: 'Pierina', 
  subtitulo: 'Lo lograste, mi amor 🎓',
  lineas: [
    'Hubo noches largas y madrugadas de estudio…',
    'Hubo días en los que el cansancio pesaba más que todo…',
    'Pero nunca dejaste de avanzar, paso a paso…',
    'Y hoy, todo ese esfuerzo se convierte en un sueño cumplido.'
  ],
  carta: [
    'Hoy el mundo entero se detiene para celebrarte, porque cada sacrificio, cada desvelo y cada lágrima valieron la pena.',
    'Estoy tan orgulloso de la mujer que eres: valiente, constante y con un corazón inmenso. Este título es solo el comienzo de todo lo que vas a lograr.',
    'Gracias por dejarme ser parte de tu camino. Te amo infinitamente. ❤️'
  ],
  firma: '— Andy',
  carpeta: 'graduacion',   // carpeta con las fotos: graduacion/1.jpg, graduacion/2.jpg, ...
  maxFotos: 30,            // cuántas fotos como máximo buscará (1, 2, 3 ...)
  musica: 'graduacion/musica.mp3' // opcional: si subes este archivo, sonará en vez de la música generada
};
/* ==================================================== */

const $ = id => document.getElementById(id);
const cel = innerWidth < 768 || (matchMedia('(pointer: coarse)').matches && innerWidth < 1100);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const rand = (a, b) => a + Math.random() * (b - a);
const smooth = (k, dt) => 1 - Math.exp(-k * dt);
const ease = t => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const ss = (a, b, x) => { x = clamp((x - a) / (b - a), 0, 1); return x * x * (3 - 2 * x); };
const V3 = THREE.Vector3;

/* ================= AUDIO (música y efectos generados, sin archivos) ================= */
let ac, master, ruidoBuf, musicaArchivo = null, intensidad = 0, sintetizar = true;
function audioInit() {
  ac = new (window.AudioContext || window.webkitAudioContext)(); master = ac.createGain(); master.gain.value = .6;
  const dl = ac.createDelay(); dl.delayTime.value = .38; const fb = ac.createGain(); fb.gain.value = .38; const wet = ac.createGain(); wet.gain.value = .45;
  master.connect(ac.destination); master.connect(dl); dl.connect(fb); fb.connect(dl); dl.connect(wet); wet.connect(ac.destination);
  ruidoBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate); const d = ruidoBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function nota(f, t, dur, tipo, vol, ataque = .01) {
  const o = ac.createOscillator(), g = ac.createGain(); o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + ataque); g.gain.exponentialRampToValueAtTime(.0001, t + dur); o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + .05);
}
function ruido(t, dur, f0, f1, vol, tipo) {
  const s = ac.createBufferSource(); s.buffer = ruidoBuf; s.loop = true; const fl = ac.createBiquadFilter(); fl.type = tipo; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = ac.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur); s.connect(fl); fl.connect(g); g.connect(master); s.start(t); s.stop(t + dur + .05);
}
const sonBoom = () => { if (!ac) return; const t = ac.currentTime; nota(140, t, .35, 'sine', .35, .005); ruido(t, .6, 1800, 200, .35, 'lowpass'); for (let i = 0; i < 7; i++) ruido(t + .12 + Math.random() * .6, .08, 5000, 3000, .08, 'highpass'); };
const sonLanzar = () => { if (!ac) return; const t = ac.currentTime; ruido(t, .4, 500, 2600, .16, 'bandpass'); nota(1318.5, t + .05, .8, 'sine', .07); nota(1568, t + .12, .8, 'sine', .05); };
const sonFanfarria = () => { if (!ac) return; const t = ac.currentTime; [261.6, 329.6, 392, 523.3, 659.3, 784, 1046.5].forEach((f, i) => { nota(f, t + i * .11, 1.8, 'triangle', .13); nota(f * 2, t + i * .11, 1.4, 'sine', .05); }); };
const ACORDES = [[130.8, 196, 261.6, 329.6], [98, 196, 246.9, 293.7], [110, 220, 261.6, 329.6], [87.3, 174.6, 261.6, 349.2]], PENTA = [523.3, 587.3, 659.3, 784, 880, 1046.5];
let proxAcorde = 0, idxAcorde = 0;
function programarMusica() { // música ambiental generada: acordes suaves + campanitas
  if (!ac || !sintetizar) return; const ahora = ac.currentTime;
  while (proxAcorde < ahora + .8) {
    const t = Math.max(proxAcorde, ahora), ch = ACORDES[idxAcorde++ % 4]; ch.forEach((f, i) => { nota(f, t, 4.2, 'triangle', .05 + intensidad * .02, 1.2); nota(f * 1.004, t, 4.2, 'sine', .04, 1.4); });
    for (let k = 0; k < 8; k++) if (Math.random() < .35 + intensidad * .55) nota(PENTA[Math.random() * PENTA.length | 0], t + k * .5 + Math.random() * .1, 1.6, 'sine', .035 + intensidad * .03);
    proxAcorde = t + 4;
  }
}

/* ================= ESCENA ================= */
const renderer = new THREE.WebGLRenderer({ antialias: !cel, powerPreference: 'high-performance' });
let pr = Math.min(devicePixelRatio, cel ? 1.5 : 2); renderer.setPixelRatio(pr); renderer.setSize(innerWidth, innerHeight); $('lienzo').appendChild(renderer.domElement);
const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, .5, 1500);
let composer = null, bloom = null;
if (!cel) { composer = new THREE.EffectComposer(renderer); composer.addPass(new THREE.RenderPass(scene, camera)); bloom = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), .55, .7, .6); composer.addPass(bloom); }
const U = { uT: { value: 0 }, uPR: { value: pr }, uGlow: { value: 0 }, uAmt: { value: 0 } };
const adit = { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending };

scene.add(new THREE.AmbientLight(0x9a88c0, .9)); const sol = new THREE.DirectionalLight(0xffe2a8, 1.5); sol.position.set(6, 12, 10); scene.add(sol);
const luzHeroe = new THREE.PointLight(0xffc860, 0, 50); luzHeroe.position.set(0, 7, 7); scene.add(luzHeroe);

function radial(stops, s = 128) { const c = document.createElement('canvas'); c.width = c.height = s; const g = c.getContext('2d'), r = s / 2, gr = g.createRadialGradient(r, r, 0, r, r, r); stops.forEach(x => gr.addColorStop(x[0], x[1])); g.fillStyle = gr; g.fillRect(0, 0, s, s); return new THREE.CanvasTexture(c); }
const texDot = radial([[0, 'rgba(255,255,255,1)'], [.35, 'rgba(255,255,255,.75)'], [1, 'rgba(255,255,255,0)']], 64);
const texGlow = radial([[0, 'rgba(255,255,255,1)'], [.2, 'rgba(255,255,255,.4)'], [.6, 'rgba(255,255,255,.08)'], [1, 'rgba(255,255,255,0)']], 256);

/* Cielo del atardecer dorado */
const cielo = new THREE.Mesh(new THREE.SphereGeometry(700, 32, 20), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, uniforms: { uT: U.uT, uGlow: U.uGlow },
  vertexShader: 'varying vec3 vD; void main(){ vD = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: `varying vec3 vD; uniform float uT, uGlow;
    void main(){ vec3 d = normalize(vD); float y = d.y;
      vec3 top = vec3(.02,.015,.08), mid = vec3(.12,.05,.26), low = vec3(.45,.16,.40), hor = vec3(1.,.62,.28);
      vec3 c = mix(low, mid, smoothstep(0., .4, y)); c = mix(c, top, smoothstep(.3, .95, y)); c = mix(c, vec3(.03,.02,.08), smoothstep(0., -.4, y));
      c += hor * exp(-abs(y) * 5.5) * (.18 + .5 * uGlow);
      float f = max(dot(d, normalize(vec3(0., .18, -1.))), 0.); c += vec3(1.,.7,.35) * pow(f, 10.) * (.12 + .5 * uGlow);
      gl_FragColor = vec4(c, 1.); }` }));
cielo.renderOrder = -10; scene.add(cielo);

/* Estrellas */
(function () {
  const n = cel ? 900 : 2200, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { const r = 600, th = Math.random() * 6.283, ph = Math.acos(clamp(Math.random() * 1.6 - .5, -1, 1)); pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  window.estrellas = new THREE.Points(g, new THREE.PointsMaterial({ size: 2.6, map: texDot, color: 0xfff1d6, ...adit, sizeAttenuation: false, opacity: 0 })); scene.add(estrellas);
})();

/* Faroles que suben al cielo */
(function () {
  const n = cel ? 36 : 70, pos = new Float32Array(n * 3), s = new Float32Array(n);
  for (let i = 0; i < n; i++) { pos.set([rand(-45, 45), rand(0, 80), rand(-70, 8)], i * 3); s[i] = Math.random(); }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('aS', new THREE.BufferAttribute(s, 1));
  const p = new THREE.Points(g, new THREE.ShaderMaterial({ ...adit, uniforms: { uT: U.uT, uAmt: U.uAmt, uPR: U.uPR },
    vertexShader: `attribute float aS; uniform float uT, uAmt, uPR; varying float vA;
      void main(){ vec3 p = position; p.y = mod(p.y + uT * (1.6 + aS * 1.4), 80.) - 8.; p.x += sin(uT * .45 + aS * 40.) * 2.5; vec4 mv = modelViewMatrix * vec4(p, 1.); gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp((26. + aS * 34.) * uPR * (40. / -mv.z), 2., 90.); vA = uAmt * smoothstep(-8., 6., p.y) * smoothstep(72., 52., p.y) * (.75 + .25 * sin(uT * 3. + aS * 30.)); }`,
    fragmentShader: 'varying float vA; void main(){ float r = length(gl_PointCoord - .5) * 2.; if(r > 1.) discard; float g = pow(1. - r, 2.2), c = smoothstep(.45, 0., r); gl_FragColor = vec4(vec3(1., .55, .18) * g * 1.2 + vec3(1., .85, .5) * c * .8, g * vA); }' }));
  p.frustumCulled = false; p.renderOrder = -4; scene.add(p);
})();

/* ================= EL BIRRETE ================= */
const matNegro = new THREE.MeshStandardMaterial({ color: 0x16162e, roughness: .5, metalness: .3, side: THREE.DoubleSide });
const matOro = new THREE.MeshStandardMaterial({ color: 0xffc94d, roughness: .28, metalness: .75, emissive: 0x6a4400, emissiveIntensity: .6 });
const geoTablero = new THREE.BoxGeometry(2.6, .12, 2.6), geoCopa = new THREE.CylinderGeometry(.85, .95, .7, 32, 1, true), geoBoton = new THREE.SphereGeometry(.1, 12, 12);
const geoCuerda = new THREE.TubeGeometry(new THREE.CatmullRomCurve3([new V3(0, .56, 0), new V3(.6, .57, .4), new V3(1.1, .54, 1.0), new V3(1.3, .46, 1.3)]), 20, .025, 6), geoBorla = new THREE.CylinderGeometry(.06, .12, .6, 10);
function crearBirrete() {
  const g = new THREE.Group(), t = new THREE.Mesh(geoTablero, matNegro); t.position.y = .45; g.add(t);
  const boton = new THREE.Mesh(geoBoton, matOro); boton.position.set(0, .56, 0);
  const borla = new THREE.Mesh(geoBorla, matOro); borla.position.set(1.3, .16, 1.3);
  g.add(new THREE.Mesh(geoCopa, matNegro), boton, new THREE.Mesh(geoCuerda, matOro), borla);
  return g;
}
const heroe = crearBirrete(); heroe.position.set(0, -12, 0); heroe.scale.setScalar(1.6); scene.add(heroe);
const aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: texGlow, color: 0xffb84a, ...adit, opacity: 0 })); aura.scale.setScalar(16); scene.add(aura);

/* Birretes lanzados al aire */
const lanzados = [];
function lanzarBirretes(n, ox = 0, oy = -2, oz = 5) {
  sonLanzar();
  for (let i = 0; i < n && lanzados.length < 60; i++) {
    const g = crearBirrete(); g.scale.setScalar(rand(.4, .6)); g.position.set(ox + rand(-3, 3), oy, oz + rand(-1, 3)); scene.add(g);
    lanzados.push({ g, v: new V3(rand(-6, 6), rand(15, 22), rand(-5, 1)), s: new V3(rand(-4, 4), rand(-5, 5), rand(-4, 4)) });
  }
}

/* Confeti */
const CN = cel ? 260 : 520, confMesh = new THREE.InstancedMesh(new THREE.PlaneGeometry(.17, .09), new THREE.MeshBasicMaterial({ side: THREE.DoubleSide }), CN), dummy = new THREE.Object3D(), cd = [];
(function () {
  const paleta = [0xffd76a, 0xffa9c9, 0xfff4dc, 0xffb84a, 0xc9a7ff, 0xff7aa8]; confMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); const c = new THREE.Color();
  for (let i = 0; i < CN; i++) { c.setHex(paleta[i % paleta.length]); confMesh.setColorAt(i, c); dummy.scale.set(0, 0, 0); dummy.updateMatrix(); confMesh.setMatrixAt(i, dummy.matrix); cd.push({ life: 0, off: true, p: new V3(), v: new V3(), r: new V3(), s: new V3(), ph: 0 }); }
  confMesh.frustumCulled = false; scene.add(confMesh);
})();
let ci = 0;

const FN = cel ? 1600 : 3000, fpos = new Float32Array(FN * 3), fvel = new Float32Array(FN * 3), fcol = new Float32Array(FN * 3), fbase = new Float32Array(FN * 3), fl = new Float32Array(FN), fm = new Float32Array(FN), fdr = new Float32Array(FN), fgr = new Float32Array(FN);

/* ================= FOTOS DEL DÍA ================= */

/* ================= LÍNEA DE TIEMPO ================= */
let fase = 'espera', tAct = 0, heroT = 0, ringT = 0, lluvia = 0, proxAuto = 3, proxToss = 22; const agenda = [];
const en = (d, f) => agenda.push({ t: d, f });
const eventosIntro = CONFIG.lineas.map((txt, i) => ({ t: .8 + i * 4.2, f: () => linea(txt) }));
eventosIntro.push({ t: .8 + CONFIG.lineas.length * 4.2 + .6, f: () => climax() });
function linea(txt) { const l = $('lineas'); l.classList.remove('on'); setTimeout(() => { l.textContent = txt; l.classList.add('on'); }, 700); }

  try { audioInit(); if (ac.state === 'suspended') ac.resume(); } catch (e) {}

/* ================= INTERACCIÓN ================= */

document.addEventListener('visibilitychange', () => { if (musicaArchivo) document.hidden ? musicaArchivo.pause() : musicaArchivo.play().catch(() => {}); if (ac) document.hidden ? ac.suspend() : ac.resume(); });

/* ================= BUCLE ================= */

  const dT = fase === 'espera' || fase === 'intro' ? 20 - Math.min(3, tAct * .2) : 17, lT = fase === 'intro' ? 9 - Math.min(3, tAct * .25) : 5.4;
  camDist += (dT - camDist) * smooth(2, dt); camLook += (lT - camLook) * smooth(2, dt);

      p.marco.renderOrder = esFoco ? 20 : 0; p.foto.renderOrder = esFoco ? 21 : 1; p.marco.material.depthTest = !esFoco; p.foto.material.depthTest = !esFoco;

    const c = lanzados[i]; c.v.y -= 18 * dt; c.g.position.addScaledVector(c.v, dt); c.g.rotation.x += c.s.x * dt; c.g.rotation.y += c.s.y * dt; c.g.rotation.z += c.s.z * dt;

    proxToss -= dt; if (proxToss <= 0) { lanzarBirretes(cel ? 5 : 9); confeti(cel ? 50 : 110, new V3(0, 14, 4), 8); proxToss = rand(20, 32); }

}
