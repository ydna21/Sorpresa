function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050300);
    scene.fog = new THREE.FogExp2(0x050300, 0.0001); 

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 30000);
    camera.position.set(0, 500, 9000);

    renderer = new THREE.WebGLRenderer({ antialias: !esCelular });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('threeCanvas').appendChild(renderer.domElement);

    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.5, 0.7);
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enabled = false;
    controls.minDistance = 500; 
    controls.maxDistance = 14000; 

    systemRotationGroup = new THREE.Group();
    scene.add(systemRotationGroup);

    crearCorazonCentral();
    crearPolvoEstelarDorado();
    crearGirasolesYTextos();

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('click', onInteractuar);
    window.addEventListener('touchstart', onInteractuar, { passive: false });
}

function crearCorazonCentral() {
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const colorDorado = new THREE.Color(0xffdb58);
    const colorNaranja = new THREE.Color(0xff8c00);

    for (let i = 0; i < 2000; i++) {
        const t = Math.random() * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = (Math.random() - 0.5) * 10;

        const scale = 15;
        positions.push(x * scale, y * scale, z * scale);

        const mixedColor = colorDorado.clone().lerp(colorNaranja, Math.random());
        colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: esCelular ? 4 : 6, vertexColors: true, transparent: true,
        opacity: 0.8, blending: THREE.AdditiveBlending
    });

    heartPoints = new THREE.Points(geometry, material);
    systemRotationGroup.add(heartPoints);

    const hitboxGeom = new THREE.SphereGeometry(400, 16, 16);
    const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
    hitboxCorazon = new THREE.Mesh(hitboxGeom, hitboxMat);
    systemRotationGroup.add(hitboxCorazon);

    const light = new THREE.PointLight(0xffdb58, 2, 2000);
    scene.add(light);
}

function crearPolvoEstelarDorado() {
    const starsGeometry = new THREE.BufferGeometry();
    const starsPositions = [];
    for (let i = 0; i < 5000; i++) {
        starsPositions.push(
            (Math.random() - 0.5) * 15000,
            (Math.random() - 0.5) * 15000,
            (Math.random() - 0.5) * 15000
        );
    }
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffe87c, size: 3, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Points(starsGeometry, starsMaterial));
}

function crearSpriteTexto(texto) {
    const canvas = document.createElement('canvas');
    canvas.width = 1200; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    ctx.font = 'bold 45px "Courier New"';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    
    ctx.lineWidth = 8; ctx.strokeStyle = 'black'; 
    ctx.strokeText(texto, 600, 64);

    ctx.fillStyle = '#ffeedd'; ctx.shadowColor = '#ffb000'; ctx.shadowBlur = 10;
    ctx.fillText(texto, 600, 64);
    
    const tex = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending }));
    sprite.scale.set(800, 85, 1);
    return sprite;
}

function crearSpriteFotoBobby(url) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 512;
  const ctx = canvas.getContext('2d');

  // Borde amarillo con resplandor
  ctx.shadowColor = '#ffdb58';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(256, 256, 220, 0, Math.PI * 2);
  ctx.fillStyle = '#ffdb58';
  ctx.fill();
  ctx.shadowBlur = 0; // Quitamos la sombra para la foto

  const tex = new THREE.CanvasTexture(canvas);
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));

  // Cargar imagen de forma asíncrona
  const img = new Image();
  img.crossOrigin = "Anonymous";
  img.onload = () => {
    ctx.save();
    ctx.beginPath();
    ctx.arc(256, 256, 205, 0, Math.PI * 2); // Recorte circular
    ctx.clip();
    
    // Centrar imagen (equivalente a object-fit: cover)
    const size = Math.min(img.width, img.height);
    const x = (img.width - size) / 2;
    const y = (img.height - size) / 2;
    ctx.drawImage(img, x, y, size, size, 51, 51, 410, 410);
    ctx.restore();
    
    tex.needsUpdate = true; // Avisar a Three.js que la foto ya cargó
  };
  img.src = url;
  
  return sprite;
}

        const anguloF = Math.random() * Math.PI * 2;
        const alturaF = (Math.random() - 0.5) * 5000;
        girasolFondo.position.set(Math.cos(anguloF) * radioF, alturaF, Math.sin(anguloF) * radioF);
        
        const escalaF = 60 + Math.random() * 100;
        girasolFondo.scale.set(escalaF, escalaF, 1);
        
        girasoles.push({ mesh: girasolFondo, angulo: anguloF, radio: radioF, velocidad: 0.0005 + Math.random() * 0.002 });
        systemRotationGroup.add(girasolFondo);
    }

    const cantidad = frases.length;
    for (let i = 0; i < cantidad; i++) {
        const girasol = crearSpriteGirasol();
        const radioCirculo = 600 + (Math.random() * 3900);
        const angulo = (i / cantidad) * Math.PI * 2 + (Math.random() * 0.5);
        const alturaAleatoria = (Math.random() - 0.5) * 1500;
        
        girasol.position.set(Math.cos(angulo) * radioCirculo, alturaAleatoria, Math.sin(angulo) * radioCirculo);
        girasol.scale.set(150, 150, 1);
        
        girasoles.push({ mesh: girasol, angulo: angulo, radio: radioCirculo, velocidad: 0.001 + Math.random() * 0.002 });
        systemRotationGroup.add(girasol);

        const texto = crearSpriteTexto(frases[i]);
        texto.position.set(girasol.position.x, girasol.position.y - 100, girasol.position.z);
        textosFlotantes.push({ mesh: texto, angulo: angulo, radio: radioCirculo, velocidad: 0.001 + Math.random() * 0.002, offsetY: alturaAleatoria });
        systemRotationGroup.add(texto);
    }
}

function onInteractuar(event) {
    if(!controls.enabled || etapaFinal) return;
    let clientX = event.clientX; let clientY = event.clientY;
    if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX; clientY = event.touches[0].clientY;
    }
    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(hitboxCorazon);

    if (intersects.length > 0) {
        clicsCorazon++;
        crearExplosionFlores();

        if (clicsCorazon === 10 && !fotosMostradas) {
            mostrarEventoFotos();
        }
    }
}

function crearExplosionFlores() {
    let grupoExplosion = new THREE.Group();
    for (let i = 0; i < 200; i++) {
        let flor = crearSpriteGirasol();
        let escalaFlor = 20 + Math.random() * 70; 
        flor.scale.set(escalaFlor, escalaFlor, 1);
        flor.position.set(0,0,0);
        
        let velocidad = new THREE.Vector3(
            (Math.random() - 0.5) * 200,
            (Math.random() - 0.5) * 200,
            (Math.random() - 0.5) * 200
        );
        
        flor.userData = { vel: velocidad, vida: 1.0 };
        grupoExplosion.add(flor);
    }
    systemRotationGroup.add(grupoExplosion);
    explosionesActivas.push(grupoExplosion);
}

function mostrarEventoFotos() {
    fotosMostradas = true;
    let i = 1;
    
    const intervaloFotos = setInterval(() => {
        if (i > 40) {
            clearInterval(intervaloFotos);
            return;
        }
        
        const material = new THREE.SpriteMaterial({ transparent: true, opacity: 0, color: 0xcccccc });
        const sprite = new THREE.Sprite(material);
        
        const angulo = Math.random() * Math.PI * 2;
        const radio = 350 + Math.random() * 1000; 
        const altura = (Math.random() - 0.5) * 800;
        
        sprite.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
        sprite.scale.set(0, 0, 1); 
        
        sprite.userData = { 
            angulo: angulo, radio: radio, velocidad: 0.002 + Math.random() * 0.004, 
            opacityTarget: 1, scaleTarget: 220 
        };
        fotosFlotantes.push(sprite);
        systemRotationGroup.add(sprite);

        textureLoader.load(`fotos/foto${i}.jpg`, (texture) => {
            sprite.material.map = texture;
            sprite.material.needsUpdate = true;
        });

        i++;
    }, 550); 
}

function crearFlorParticulas() {
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const colorCentro = new THREE.Color(0x5c2c00); 
    const colorPetalo1 = new THREE.Color(0xffdb58); 
    const colorPetalo2 = new THREE.Color(0xff9900); 

    for (let i = 0; i < 6000; i++) {
        let x, y, z, colorDeseado;
        
        if (i < 2500) {
            const r = Math.sqrt(i) * 0.4;
            const theta = i * 137.5 * (Math.PI / 180);
            x = r * Math.cos(theta);
            y = r * Math.sin(theta);
            z = (Math.random() - 0.5) * 2;
            colorDeseado = colorCentro.clone().lerp(new THREE.Color(0x3a1b00), Math.random());
        } else {
            const theta = Math.random() * Math.PI * 2;
            const largoBase = 18;
            const extension = 35 * Math.pow(Math.abs(Math.sin(theta * 8)), 0.5); 
            const r = largoBase + Math.random() * extension;
            
            x = r * Math.cos(theta);
            y = r * Math.sin(theta);
            z = (Math.random() - 0.5) * 4;
            colorDeseado = colorPetalo1.clone().lerp(colorPetalo2, Math.random());
        }

        positions.push(x * 1.5, y * 1.5, z * 1.5);
        colors.push(colorDeseado.r, colorDeseado.g, colorDeseado.b);
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: esCelular ? 3 : 5, vertexColors: true, transparent: true,
        opacity: 0.9, blending: THREE.AdditiveBlending
    });

    return new THREE.Points(geometry, material);
}

function iniciarFinalMagico() {
    etapaFinal = true;
    
    document.getElementById('mainContent').style.opacity = '0';
    document.getElementById('letrasContainer').style.opacity = '0';
    
    florParticulas = crearFlorParticulas();
    florParticulas.scale.set(0, 0, 0); 
    scene.add(florParticulas); 
    
    document.getElementById('textoFinal').style.display = 'block';

    // --- NUEVO: CREAR Y UBICAR LAS FOTOS EN 3D ---
    if(!spriteBobby1) {
      scene.add(camera); 
      
      const posX = esCelular ? 16 : 28;
      const posY = esCelular ? 38 : 35; 
      const escala = esCelular ? 26 : 35;

      spriteBobby1 = crearSpriteFotoBobby('./flores/foto1.jpg');
      spriteBobby1.position.set(-posX, posY, -100); 
      spriteBobby1.scale.set(escala, escala, 1);
      camera.add(spriteBobby1);

      spriteBobby2 = crearSpriteFotoBobby('./flores/foto2.jpg');
      spriteBobby2.position.set(posX, posY, -100);
      spriteBobby2.scale.set(escala, escala, 1);
      camera.add(spriteBobby2);
    } else {
      spriteBobby1.visible = true;
      spriteBobby2.visible = true;
    }
}

function actualizarLetras() {
    const audioEl = document.getElementById('musicaFondo');
    const divLetras = document.getElementById('letrasContainer');
    if (!audioEl || !divLetras) return;

    const tiempo = audioEl.currentTime;

    if (tiempo >= 5 && !etapaFinal) {
        iniciarFinalMagico();
    }

    let textoActual = "";
    for (let i = 0; i < letrasSincronizadas.length; i++) {
        if (tiempo >= letrasSincronizadas[i].t) {
            textoActual = letrasSincronizadas[i].txt;
        } else {
            break;
        }
    }

    if (!etapaFinal && divLetras.innerHTML !== textoActual) {
        divLetras.innerHTML = textoActual;
    }
}

let enViaje = false;
let viajeProgress = 0;
const viajeDuration = 4000;

function iniciarViaje() {
    enViaje = true;
}

let prevTime = Date.now();

function animate() {
    requestAnimationFrame(animate);
    const time = Date.now();
    const delta = (time - prevTime) / 1000;
    prevTime = time;

    actualizarLetras(); 

    if (etapaFinal) {
        systemRotationGroup.rotation.y += delta * 4;
        systemRotationGroup.scale.lerp(new THREE.Vector3(0, 0, 0), 0.015);
        
        if (systemRotationGroup.scale.x < 0.2 && florParticulas) {
            florParticulas.scale.lerp(new THREE.Vector3(25, 25, 25), 0.02);
            florParticulas.rotation.z += delta * 0.2; 
            
            if (florParticulas.scale.x > 15) {
                document.getElementById('textoFinal').style.opacity = '1';
            }
        }

        // --- NUEVO: ANIMACIÓN DE FLOTACIÓN FOTOS 3D ---
        if (spriteBobby1 && spriteBobby2) {
            const timeVal = Date.now() * 0.002;
            const basePosY = esCelular ? 38 : 35;
            spriteBobby1.position.y = basePosY + Math.sin(timeVal) * 1.5;
            spriteBobby2.position.y = basePosY + Math.sin(timeVal + 1.5) * 1.5;
        }

    } else {
        systemRotationGroup.rotation.y += delta * 0.05;

        if (heartPoints && hitboxCorazon) {
            let latido = 1 + Math.sin(time * 0.004) * 0.08;
            heartPoints.scale.set(latido, latido, latido);
            hitboxCorazon.scale.set(latido, latido, latido);
        }

        girasoles.forEach((g) => {
            g.angulo += g.velocidad;
            g.mesh.position.x = Math.cos(g.angulo) * g.radio;
            g.mesh.position.z = Math.sin(g.angulo) * g.radio;
        });

        textosFlotantes.forEach((t) => {
            t.angulo += t.velocidad;
            t.mesh.position.x = Math.cos(t.angulo) * t.radio;
            t.mesh.position.z = Math.sin(t.angulo) * t.radio;
            t.mesh.position.y = t.offsetY + Math.sin(time * 0.002 + t.angulo) * 40; 
        });

        fotosFlotantes.forEach((f) => {
            f.userData.angulo += f.userData.velocidad;
            f.position.x = Math.cos(f.userData.angulo) * f.userData.radio;
            f.position.z = Math.sin(f.userData.angulo) * f.userData.radio;
            
            if (f.material.opacity < f.userData.opacityTarget) {
                f.material.opacity += 0.02; 
            }
            if (f.scale.x < f.userData.scaleTarget) {
                const nuevaEscala = f.scale.x + (f.userData.scaleTarget - f.scale.x) * 0.05;
                f.scale.set(nuevaEscala, nuevaEscala, 1);
            }
        });
    }

    if (enViaje) {
        viajeProgress += delta * 1000;
        if (viajeProgress >= viajeDuration) {
            viajeProgress = viajeDuration;
            enViaje = false;
            controls.enabled = true;
        }
        const ratio = viajeProgress / viajeDuration;
        const easeRatio = 1 - Math.pow(1 - ratio, 3);
        camera.position.z = THREE.MathUtils.lerp(9000, 2200, easeRatio);
        camera.position.y = THREE.MathUtils.lerp(500, 200, easeRatio);
    }

    for (let i = explosionesActivas.length - 1; i >= 0; i--) {
        let grupo = explosionesActivas[i];
        let vivas = false;
        grupo.children.forEach(flor => {
            flor.position.add(flor.userData.vel);
            flor.userData.vida -= 0.015; 
            if (flor.userData.vida > 0) {
                flor.material.opacity = flor.userData.vida;
                vivas = true;
            }
        });
        if (!vivas) {
            systemRotationGroup.remove(grupo);
            explosionesActivas.splice(i, 1);
        }
    }

    if (controls.enabled) controls.update();
    composer.render();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

init();
animate();
</script>
