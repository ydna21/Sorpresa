<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feliz Día de las Flores Amarillas 🌻</title>
<style>
  body { 
    margin: 0; background: black; overflow: hidden; 
    font-family: 'Courier New', monospace; color: white; 
  }
  
  /* PANTALLA DE INICIO (ESTILO TIKTOK) */
  #pantallaEntrada {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: radial-gradient(circle at center, #1a1000 0%, #000000 100%);
    z-index: 999; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    transition: opacity 2s ease;
  }

  #btnIniciar {
    background: transparent;
    border: none;
    color: #ffdb58; 
    font-size: 1.5rem;
    font-family: 'Courier New', monospace;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px;
    animation: latidoEntrada 2s infinite;
    text-shadow: 0 0 15px rgba(255, 219, 88, 0.8);
  }

  .icono-flor {
    font-size: 3rem;
    filter: drop-shadow(0 0 20px #ffdb58);
  }

  @keyframes latidoEntrada {
    0% { transform: scale(1); opacity: 0.8; }
    50% { transform: scale(1.1); opacity: 1; text-shadow: 0 0 30px #ffdb58; }
    100% { transform: scale(1); opacity: 0.8; }
  }

  #threeCanvas { display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  /* TEXTO CENTRAL EN EL VIAJE */
  #mainContent {
    position: absolute; top: 50px; left: 0; width: 100%;
    z-index: 2; display: flex; flex-direction: column;
    align-items: center; text-align: center; pointer-events: none;
    opacity: 0; transition: opacity 3s ease;
  }
  
  h1 { 
    font-size: 2.5rem; color: #fff; 
    text-shadow: 0 0 20px #ffdb58, 0 0 40px #d4af37; 
    margin: 0; font-family: 'Georgia', serif; font-style: italic;
  }

  /* Indicador secreto */
  #mensajeInteractivo {
    position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
    font-size: 1.2rem; color: #ffdb58; text-shadow: 0 0 10px #ff8c00;
    pointer-events: none; opacity: 0; transition: opacity 1s ease;
    animation: latidoEntrada 2s infinite;
    z-index: 10;
  }

  @media (max-width: 768px) {
    h1 { font-size: 1.5rem; padding: 0 10px;}
    #mensajeInteractivo { font-size: 1rem; }
  }
</style>
</head>
<body>

<audio id="musicaFondo" loop crossorigin="anonymous">
  <source src="videos/musicafloresamarillas.mp3" type="audio/mpeg">
</audio>

<div id="pantallaEntrada">
  <button id="btnIniciar">
    Toca para iniciar
    <span class="icono-flor">🌻</span>
  </button>
</div>

<div id="threeCanvas"></div>

<div id="mainContent">
  <h1 id="tituloPrincipal">Feliz Día de las Flores Amarillas 🌻💛</h1>
</div>

<div id="mensajeInteractivo">¡Toca el corazón de luz! ✨</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
const esCelular = window.innerWidth < 768;
let scene, camera, renderer, controls, composer;
let systemRotationGroup, heartPoints, hitboxCorazon;
let girasoles = [];
let textosFlotantes = [];
let fotosFlotantes = [];
let explosionesActivas = [];

let clicsCorazon = 0;
let fotosMostradas = false;
const textureLoader = new THREE.TextureLoader();

// MUCHAS frases para un universo gigante
const frases = [
    "Un ramo de gracias por estar ahí ✨", "Eres mi sol de siempre 💛", "Contigo la vida es mejor 🌻",
    "No siempre necesitas un jardín para florecer", "Tú iluminas mis días oscuros", "Gracias por quererme siempre",
    "Mi lugar favorito es contigo", "Un amor bonito y sincero", "Que siempre florezca nuestra alegría",
    "Para ti, con todo mi corazón 💛", "Eres mi universo entero", "A tu lado todo es dorado",
    "Mi estrella más brillante ✨", "Mi mundo gira a tu alrededor", "Eres el amarillo de mi vida 🌻",
    "Juntos brillamos más", "Un millón de girasoles para ti", "Tu sonrisa es mi luz", "Por siempre tú y yo",
    "Cada día a tu lado es magia", "Haces mi vida hermosa", "Eres mi flor favorita", "Mi corazón te elige siempre",
    "Eres mi lugar seguro", "Contigo hasta el infinito 🚀", "Un amor de otra galaxia", "Tus abrazos son mi sol",
    "Gracias por existir", "Tu y yo contra el universo", "Mi felicidad lleva tu nombre",
    "Eres mi coincidencia favorita", "Brillas más que las estrellas", "Te amo hoy y siempre 💛",
    "Eres magia pura", "Nunca dejes de florecer", "Mi mejor casualidad", "Siempre te voy a cuidar",
    "Eres mi poesía favorita", "Contigo todo tiene sentido", "El universo nos unió"
];

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

document.getElementById('btnIniciar').addEventListener('click', function() {
    document.getElementById('musicaFondo').play();
    const pantalla = document.getElementById('pantallaEntrada');
    pantalla.style.opacity = '0';
    
    setTimeout(() => {
        pantalla.style.display = 'none';
        document.getElementById('mainContent').style.opacity = '1';
        iniciarViaje();
    }, 2000);
});

function init() {
    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050300);
    scene.fog = new THREE.FogExp2(0x050300, 0.0001); // Neblina más suave para ver lejos

    camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 30000);
    camera.position.set(0, 500, 9000);

    renderer = new THREE.WebGLRenderer({ antialias: !esCelular });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('threeCanvas').appendChild(renderer.domElement);

    const renderScene = new THREE.RenderPass(scene, camera);
    const bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.3);
    composer = new THREE.EffectComposer(renderer);
    composer.addPass(renderScene);
    composer.addPass(bloomPass);

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.enabled = false;

    systemRotationGroup = new THREE.Group();
    scene.add(systemRotationGroup);

    crearCorazonCentral();
    crearPolvoEstelarDorado();
    crearGirasolesYTextos();

    window.addEventListener('resize', onWindowResize);
    window.addEventListener('click', onInteractuar);
    window.addEventListener('touchstart', onInteractuar, { passive: false });
}

function crearCorazonCentral() {
    const geometry = new THREE.BufferGeometry();
    const positions = [];
    const colors = [];
    const colorDorado = new THREE.Color(0xffdb58);
    const colorNaranja = new THREE.Color(0xff8c00);

    for (let i = 0; i < 2000; i++) {
        const t = Math.random() * Math.PI * 2;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        const z = (Math.random() - 0.5) * 10;

        const scale = 15;
        positions.push(x * scale, y * scale, z * scale);

        const mixedColor = colorDorado.clone().lerp(colorNaranja, Math.random());
        colors.push(mixedColor.r, mixedColor.g, mixedColor.b);
    }

    geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

    const material = new THREE.PointsMaterial({
        size: esCelular ? 4 : 6, vertexColors: true, transparent: true,
        opacity: 0.8, blending: THREE.AdditiveBlending
    });

    heartPoints = new THREE.Points(geometry, material);
    systemRotationGroup.add(heartPoints);

    // HITBOX INVISIBLE PARA EL CORAZÓN (Detectar clics fácilmente)
    const hitboxGeom = new THREE.SphereGeometry(300, 16, 16);
    const hitboxMat = new THREE.MeshBasicMaterial({ visible: false });
    hitboxCorazon = new THREE.Mesh(hitboxGeom, hitboxMat);
    systemRotationGroup.add(hitboxCorazon);

    const light = new THREE.PointLight(0xffdb58, 2, 2000);
    scene.add(light);
}

function crearPolvoEstelarDorado() {
    const starsGeometry = new THREE.BufferGeometry();
    const starsPositions = [];
    for (let i = 0; i < 5000; i++) {
        starsPositions.push(
            (Math.random() - 0.5) * 15000,
            (Math.random() - 0.5) * 15000,
            (Math.random() - 0.5) * 15000
        );
    }
    starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsPositions, 3));
    const starsMaterial = new THREE.PointsMaterial({ color: 0xffe87c, size: 3, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending });
    scene.add(new THREE.Points(starsGeometry, starsMaterial));
}

function crearSpriteGirasol() {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    ctx.font = '150px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🌻', 128, 128);
    const tex = new THREE.CanvasTexture(canvas);
    return new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
}

function crearSpriteTexto(texto) {
    const canvas = document.createElement('canvas');
    canvas.width = 1200; canvas.height = 128;
    const ctx = canvas.getContext('2d');
    
    ctx.font = 'bold 45px "Courier New"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    
    // BORDE PARA HACERLO MUCHO MÁS LEGIBLE
    ctx.lineWidth = 8;
    ctx.strokeStyle = 'black'; 
    ctx.strokeText(texto, 600, 64);

    // RELLENO Y BRILLO
    ctx.fillStyle = '#ffeedd';
    ctx.shadowColor = '#ffb000';
    ctx.shadowBlur = 10;
    ctx.fillText(texto, 600, 64);
    
    const tex = new THREE.CanvasTexture(canvas);
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true, blending: THREE.AdditiveBlending }));
    sprite.scale.set(800, 85, 1);
    return sprite;
}

function crearGirasolesYTextos() {
    const cantidad = frases.length;
    for (let i = 0; i < cantidad; i++) {
        const girasol = crearSpriteGirasol();
        // Espacio inmenso: Radios desde 600 hasta 4500
        const radioCirculo = 600 + (Math.random() * 3900);
        const angulo = (i / cantidad) * Math.PI * 2 + (Math.random() * 0.5);
        const alturaAleatoria = (Math.random() - 0.5) * 1500;
        
        girasol.position.set(Math.cos(angulo) * radioCirculo, alturaAleatoria, Math.sin(angulo) * radioCirculo);
        girasol.scale.set(150, 150, 1);
        
        girasoles.push({ mesh: girasol, angulo: angulo, radio: radioCirculo, velocidad: 0.001 + Math.random() * 0.002 });
        systemRotationGroup.add(girasol);

        const texto = crearSpriteTexto(frases[i]);
        texto.position.set(girasol.position.x, girasol.position.y - 100, girasol.position.z);
        textosFlotantes.push({ mesh: texto, angulo: angulo, radio: radioCirculo, velocidad: 0.001 + Math.random() * 0.002, offsetY: alturaAleatoria });
        systemRotationGroup.add(texto);
    }
}

// LÓGICA DE CLICS E INTERACCIÓN
function onInteractuar(event) {
    if(!controls.enabled) return;

    let clientX = event.clientX;
    let clientY = event.clientY;
    if (event.touches && event.touches.length > 0) {
        clientX = event.touches[0].clientX;
        clientY = event.touches[0].clientY;
    }

    mouse.x = (clientX / window.innerWidth) * 2 - 1;
    mouse.y = -(clientY / window.innerHeight) * 2 + 1;

    raycaster.setFromCamera(mouse, camera);
    const intersects = raycaster.intersectObject(hitboxCorazon);

    if (intersects.length > 0) {
        clicsCorazon++;
        crearExplosionFlores();

        if (clicsCorazon === 10 && !fotosMostradas) {
            mostrarEventoFotos();
            document.getElementById('mensajeInteractivo').style.display = 'none';
        }
    }
}

function crearExplosionFlores() {
    let grupoExplosion = new THREE.Group();
    for (let i = 0; i < 20; i++) {
        let flor = crearSpriteGirasol();
        flor.scale.set(40, 40, 1);
        flor.position.set(0,0,0);
        
        // Disparar en todas las direcciones
        let velocidad = new THREE.Vector3(
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40,
            (Math.random() - 0.5) * 40
        );
        
        flor.userData = { vel: velocidad, vida: 1.0 };
        grupoExplosion.add(flor);
    }
    systemRotationGroup.add(grupoExplosion);
    explosionesActivas.push(grupoExplosion);
}

function mostrarEventoFotos() {
    fotosMostradas = true;
    for (let i = 1; i <= 40; i++) {
        // Busca en la carpeta fotos, archivos 1.jpg, 2.jpg... 40.jpg
        textureLoader.load(`fotos/${i}.jpg`, (texture) => {
            const material = new THREE.SpriteMaterial({ map: texture, transparent: true, opacity: 0 });
            const sprite = new THREE.Sprite(material);
            
            const angulo = Math.random() * Math.PI * 2;
            const radio = 800 + Math.random() * 2500;
            const altura = (Math.random() - 0.5) * 2000;
            
            sprite.position.set(Math.cos(angulo) * radio, altura, Math.sin(angulo) * radio);
            sprite.scale.set(300, 300, 1);
            
            sprite.userData = { angulo: angulo, radio: radio, velocidad: 0.003 + Math.random() * 0.005 };
            fotosFlotantes.push(sprite);
            systemRotationGroup.add(sprite);
        });
    }
}

let enViaje = false;
let viajeProgress = 0;
const viajeDuration = 4000;

function iniciarViaje() {
    enViaje = true;
    setTimeout(() => {
        document.getElementById('mensajeInteractivo').style.opacity = '1';
    }, 4500);
}

let prevTime = Date.now();

function animate() {
    requestAnimationFrame(animate);
    const time = Date.now();
    const delta = (time - prevTime) / 1000;
    prevTime = time;

    // Latido del corazón (Pulsación)
    if (heartPoints && hitboxCorazon) {
        let latido = 1 + Math.sin(time * 0.004) * 0.08;
        heartPoints.scale.set(latido, latido, latido);
        hitboxCorazon.scale.set(latido, latido, latido);
    }

    if (enViaje) {
        viajeProgress += delta * 1000;
        if (viajeProgress >= viajeDuration) {
            viajeProgress = viajeDuration;
            enViaje = false;
            controls.enabled = true;
        }
        const ratio = viajeProgress / viajeDuration;
        const easeRatio = 1 - Math.pow(1 - ratio, 3);
        camera.position.z = THREE.MathUtils.lerp(9000, 2200, easeRatio);
        camera.position.y = THREE.MathUtils.lerp(500, 200, easeRatio);
    }

    systemRotationGroup.rotation.y += delta * 0.05;

    girasoles.forEach((g) => {
        g.angulo += g.velocidad;
        g.mesh.position.x = Math.cos(g.angulo) * g.radio;
        g.mesh.position.z = Math.sin(g.angulo) * g.radio;
    });

    textosFlotantes.forEach((t) => {
        t.angulo += t.velocidad;
        t.mesh.position.x = Math.cos(t.angulo) * t.radio;
        t.mesh.position.z = Math.sin(t.angulo) * t.radio;
        t.mesh.position.y = t.offsetY + Math.sin(time * 0.002 + t.angulo) * 40; // Oscilación
    });

    fotosFlotantes.forEach((f) => {
        f.userData.angulo += f.userData.velocidad;
        f.position.x = Math.cos(f.userData.angulo) * f.userData.radio;
        f.position.z = Math.sin(f.userData.angulo) * f.userData.radio;
        if (f.material.opacity < 1) f.material.opacity += 0.01; // Aparecen suavemente
    });

    // Animar explosiones
    for (let i = explosionesActivas.length - 1; i >= 0; i--) {
        let grupo = explosionesActivas[i];
        let vivas = false;
        grupo.children.forEach(flor => {
            flor.position.add(flor.userData.vel);
            flor.userData.vida -= 0.02;
            if (flor.userData.vida > 0) {
                flor.material.opacity = flor.userData.vida;
                vivas = true;
            }
        });
        if (!vivas) {
            systemRotationGroup.remove(grupo);
            explosionesActivas.splice(i, 1);
        }
    }

    if (controls.enabled) controls.update();
    composer.render();
}

function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    composer.setSize(window.innerWidth, window.innerHeight);
}

init();
animate();
</script>
</body>
</html>
