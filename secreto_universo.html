<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Núcleo de Nuestro Universo ✨</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
  
  #canvasContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
  }

  /* Pantalla de Entrada Secreta */
  #intro-screen {
    background: rgba(0, 0, 0, 0.9);
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; transition: opacity 2s ease;
  }

  .glitch {
    font-size: 2.2rem; font-weight: bold; color: #fff;
    text-shadow: 0 0 10px #ff1493, 0 0 20px #8a2be2;
    text-align: center; padding: 20px;
    animation: pulsate 2s infinite alternate;
  }

  @keyframes pulsate {
    0% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 10px #ff1493; }
    100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px #ff69b4, 0 0 40px #00ffff; }
  }

  #btnAdentrarse {
    margin-top: 30px; padding: 15px 40px; font-size: 1.2rem;
    background: transparent; color: white; border: 2px solid #ff1493;
    border-radius: 50px; cursor: pointer; pointer-events: auto;
    box-shadow: 0 0 15px #ff1493 inset, 0 0 20px #ff1493;
    transition: all 0.5s ease; text-transform: uppercase; letter-spacing: 2px;
  }
  #btnAdentrarse:hover { background: #ff1493; box-shadow: 0 0 40px #ff1493; transform: scale(1.1); }

  /* Texto Revelación */
  #mensaje-secreto {
    position: absolute; bottom: 15%; width: 90%; max-width: 700px;
    text-align: center; font-size: 1.5rem; line-height: 1.6;
    color: #fff; text-shadow: 0 0 15px #ff1493, 0 0 30px #ff69b4;
    opacity: 0; transition: opacity 2s ease; font-weight: bold;
  }

  .btn-volver {
    position: absolute; bottom: 30px; padding: 12px 30px;
    background: rgba(255, 20, 147, 0.2); border: 2px solid #ff69b4;
    color: white; border-radius: 25px; font-family: inherit; font-size: 1.1rem;
    cursor: pointer; pointer-events: auto; opacity: 0; transition: opacity 3s ease, transform 0.3s;
    box-shadow: 0 0 20px rgba(255,105,180,0.5); font-weight: bold;
  }
  .btn-volver:hover { background: #ff1493; transform: scale(1.1); box-shadow: 0 0 40px #ff69b4; }

  #flash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: white; z-index: 15; opacity: 0; pointer-events: none;
  }
</style>
</head>
<body>

<audio id="musicaSecreta" loop>
  <source src="videos/musicasecreto.mp3" type="audio/mpeg">
</audio>

<div id="canvasContainer"></div>
<div id="flash-screen"></div>

<div id="ui-layer">
  <div id="mensaje-secreto"></div>
  <button class="btn-volver" id="btnVolver" onclick="window.history.back()">🌌 Regresar a Nuestro Mundo</button>
</div>

<div id="intro-screen">
  <div class="glitch">Has descubierto el núcleo oculto...</div>
  <p style="color: #ccc; text-align: center; max-width: 80%; font-size:1.1rem; line-height: 1.5;">
    Solo la paciencia infinita o el esfuerzo inalcanzable <br>podían abrir esta puerta.
  </p>
  <button id="btnAdentrarse">Desatar el Universo</button>
</div>

<!-- Scripts de Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// --- CONFIGURACIÓN TÉCNICA ---
const esCelular = window.innerWidth < 768;
let scene, camera, renderer, composer, bloomPass, controls;

// Sistemas de partículas y efectos
let particleSystem, particleGeometry;
let currentPositions, heartPositions, explosionVelocities, galaxyPositions, colorsArray;
let shootingStarsSystem, shootingStarsPositions, shootingStarsVelocities;
let shockwaveMesh; // Nueva onda expansiva

const numParticles = esCelular ? 6000 : 12000;
const numShootingStars = esCelular ? 300 : 800;

// Máquina de estados para la animación
let animState = 'IDLE'; 
let morphProgress = 0;
let explosionProgress = 0;
let galaxyProgress = 0;
let clock = new THREE.Clock();
let timeElapsed = 0;

let mainGroup = new THREE.Group();

const textosSecretos = [
  "Aquí, en el centro absoluto de todo...",
  "Donde el tiempo se detiene...",
  "Cada estrella es un momento a tu lado.",
  "Este es el núcleo de mi universo.",
  "Tú eres mi destino final. ❤️"
];

init();
animate();

function init() {
  const container = document.getElementById('canvasContainer');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.0003);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 15000);
  camera.position.set(0, 0, 4000); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Post-procesado (Glow Mágico)
  const renderScene = new THREE.RenderPass(scene, camera);
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1);
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enableZoom = false; 
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.maxPolarAngle = Math.PI / 1.5; // Ángulo para que se vea el 3D del corazón

  prepararMatematicas();
  crearSistemaParticulas();
  crearLluviaEstrellas();
  crearOndaExpansiva();
  
  scene.add(mainGroup);
  window.addEventListener('resize', onWindowResize);
}

function createStarTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.2, 'rgba(255, 105, 180, 0.8)');
  gradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.2)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(canvas);
}

// --- PREPARAR EFECTOS ---
function crearOndaExpansiva() {
  const ringGeo = new THREE.RingGeometry(1, 15, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending
  });
  shockwaveMesh = new THREE.Mesh(ringGeo, ringMat);
  scene.add(shockwaveMesh);
}

function prepararMatematicas() {
  currentPositions = new Float32Array(numParticles * 3);
  heartPositions = new Float32Array(numParticles * 3);
  explosionVelocities = new Float32Array(numParticles * 3);
  galaxyPositions = new Float32Array(numParticles * 3);
  colorsArray = new Float32Array(numParticles * 3);

  const colorBase = new THREE.Color(0xff1493); 
  const colorAlt = new THREE.Color(0x00ffff);  
  const colorCore = new THREE.Color(0xffd700); 

  for (let i = 0; i < numParticles; i++) {
    const i3 = i * 3;
    
    // 1. INICIO (Nebulosa dispersa)
    const radioInicial = 4000 + Math.random() * 2000;
    const thetaInicial = Math.random() * Math.PI * 2;
    const phiInicial = Math.acos(Math.random() * 2 - 1);
    currentPositions[i3] = radioInicial * Math.sin(phiInicial) * Math.cos(thetaInicial);
    currentPositions[i3 + 1] = radioInicial * Math.sin(phiInicial) * Math.sin(thetaInicial);
    currentPositions[i3 + 2] = radioInicial * Math.cos(phiInicial);

    // 2. CORAZÓN 
    const t = Math.random() * Math.PI * 2; 
    let xH = 16 * Math.pow(Math.sin(t), 3);
    let yH = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    const escalaH = esCelular ? 6 : 10;
    const distAlCentro = Math.sqrt(xH*xH + yH*yH);
    const factorVolumen = Math.max(0, 1 - (distAlCentro / 16));
    const zH = (Math.random() - 0.5) * 80 * factorVolumen;
    const dispersion = (Math.random() - 0.5) * 15;
    
    heartPositions[i3] = (xH * escalaH) + dispersion;
    heartPositions[i3 + 1] = (yH * escalaH) + dispersion;
    heartPositions[i3 + 2] = zH + dispersion;

    // 3. EXPLOSIÓN 
    const vel = new THREE.Vector3(heartPositions[i3], heartPositions[i3+1], heartPositions[i3+2]).normalize();
    const speed = 40 + Math.random() * 100; // Un poco más rápida para compensar
    explosionVelocities[i3] = vel.x * speed;
    explosionVelocities[i3+1] = vel.y * speed;
    explosionVelocities[i3+2] = vel.z * speed + (Math.random() - 0.5)*30; 

    // 4. GALAXIA ESPIRAL
    const brazos = 4;
    const armOffset = (i % brazos) * ((Math.PI * 2) / brazos);
    const radioG = Math.random() * 800; 
    const angleG = (radioG * 0.015) + armOffset; 
    
    const dispersionG = (800 - radioG) * 0.1 * (Math.random() - 0.5); 
    const alturaG = (Math.random() - 0.5) * 80 * (1 - (radioG/800)); 

    galaxyPositions[i3] = Math.cos(angleG) * radioG + dispersionG;
    galaxyPositions[i3 + 1] = alturaG;
    galaxyPositions[i3 + 2] = Math.sin(angleG) * radioG + dispersionG;

    // COLORES
    let c = colorBase.clone();
    if (Math.random() > 0.5) c = colorAlt.clone();
    if (radioG < 100 || distAlCentro < 5) c = colorCore.clone(); 
    colorsArray[i3] = c.r;
    colorsArray[i3 + 1] = c.g;
    colorsArray[i3 + 2] = c.b;
  }
}

function crearSistemaParticulas() {
  particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
  particleGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

  const material = new THREE.PointsMaterial({
    size: esCelular ? 6 : 8,
    map: createStarTexture(),
    transparent: true, opacity: 0.9, vertexColors: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  particleSystem = new THREE.Points(particleGeometry, material);
  mainGroup.add(particleSystem);
}

function crearLluviaEstrellas() {
  const geom = new THREE.BufferGeometry();
  shootingStarsPositions = new Float32Array(numShootingStars * 3);
  shootingStarsVelocities = new Float32Array(numShootingStars);
  
  for(let i=0; i<numShootingStars; i++){
    shootingStarsPositions[i*3] = (Math.random() - 0.5) * 4000;
    shootingStarsPositions[i*3+1] = (Math.random() - 0.5) * 4000;
    shootingStarsPositions[i*3+2] = Math.random() * 4000 - 2000; 
    shootingStarsVelocities[i] = 20 + Math.random() * 50; 
  }
  
  geom.setAttribute('position', new THREE.BufferAttribute(shootingStarsPositions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffffff, size: 4, transparent: true, opacity: 0, 
    blending: THREE.AdditiveBlending, depthWrite: false
  });
  
  shootingStarsSystem = new THREE.Points(geom, mat);
  scene.add(shootingStarsSystem);
}

// --- EVENTOS Y NARRATIVA ---
document.getElementById('btnAdentrarse').addEventListener('click', () => {
  document.getElementById('musicaSecreta').play();
  document.getElementById('intro-screen').style.opacity = '0';
  setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 2000);
  
  animState = 'WARP_IN';
  iniciarWarp();
});

function iniciarWarp() {
  let warpInterval = setInterval(() => {
    camera.position.z -= (camera.position.z - 400) * 0.05;
    if (camera.position.z <= 410) {
      clearInterval(warpInterval);
      controls.enableZoom = true;
      controls.minDistance = 200;
      controls.maxDistance = 1500;
      animState = 'MORPH_HEART';
      escribirMensajePoetico();
    }
  }, 16);
}

function escribirMensajePoetico() {
  const divMensaje = document.getElementById('mensaje-secreto');
  divMensaje.style.opacity = '1';
  let index = 0;
  
  function siguienteLinea() {
    if (index >= textosSecretos.length) {
      setTimeout(() => {
        divMensaje.style.opacity = '0';
        desatarSupernova(); 
      }, 3000);
      return;
    }
    
    divMensaje.style.opacity = '0';
    setTimeout(() => {
      divMensaje.innerText = textosSecretos[index];
      divMensaje.style.opacity = '1';
      index++;
      setTimeout(siguienteLinea, 4500); // Dar un poco más de tiempo de lectura
    }, 1000);
  }
  siguienteLinea();
}

function desatarSupernova() {
  animState = 'PRE_EXPLOSION';
  controls.autoRotateSpeed = 15.0; // Giro caótico
  
  setTimeout(() => {
    animState = 'EXPLOSION';
    
    // Efecto de Shockwave (Onda expansiva visual)
    shockwaveMesh.material.opacity = 1;
    
    // Flash de pantalla
    const flash = document.getElementById('flash-screen');
    flash.style.opacity = '1'; 
    setTimeout(() => { flash.style.opacity = '0'; flash.style.transition = 'opacity 2.5s'; }, 100);
    
    setTimeout(() => {
      animState = 'GALAXY';
      controls.autoRotateSpeed = 2.0; 
      shootingStarsSystem.material.opacity = 0.8; 
      
      setTimeout(() => {
        document.getElementById('btnVolver').style.opacity = '1';
      }, 5000);

    }, 2000); 
  }, 3500); // Darle tiempo a la sobrecarga
}

// --- BUCLE PRINCIPAL (MÁQUINA DE ESTADOS) ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  timeElapsed += delta;

  const posiciones = particleGeometry.attributes.position.array;

  switch(animState) {
    case 'MORPH_HEART':
      // FORMACIÓN MUY LENTA (Ajustado para que tarde unos 12-15 segundos)
      if (morphProgress < 1) {
        morphProgress += delta * 0.055; // Velocidad reducida drásticamente
        const ease = 1 - Math.pow(1 - morphProgress, 3);
        for (let i = 0; i < numParticles * 3; i++) {
          posiciones[i] = currentPositions[i] + (heartPositions[i] - currentPositions[i]) * ease;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      } else {
        animState = 'HEARTBEAT';
      }
      // Pequeño latido inicial mientras se forma
      const initBeat = Math.sin(timeElapsed * 2) * 0.05;
      mainGroup.scale.set(1 + initBeat, 1 + initBeat, 1 + initBeat);
      break;

    case 'HEARTBEAT':
      const heartbeat = Math.sin(timeElapsed * 3) * Math.cos(timeElapsed * 1.5);
      const escala = 1 + (heartbeat > 0.5 ? (heartbeat - 0.5) * 0.18 : 0);
      mainGroup.scale.set(escala, escala, escala);
      bloomPass.strength = 2.0 + (heartbeat > 0.5 ? heartbeat * 1.2 : 0);
      break;

    case 'PRE_EXPLOSION':
      const fastBeat = Math.sin(timeElapsed * 20);
      const fastEscala = 1 + (fastBeat > 0 ? fastBeat * 0.3 : 0);
      mainGroup.scale.set(fastEscala, fastEscala, fastEscala);
      bloomPass.strength += delta * 3; 
      break;

    case 'EXPLOSION':
      mainGroup.scale.set(1, 1, 1);
      bloomPass.strength = 5.0; // Brillo máximo
      
      // Expandir partículas
      for (let i = 0; i < numParticles * 3; i++) {
        posiciones[i] += explosionVelocities[i] * delta * 2.5;
      }
      particleGeometry.attributes.position.needsUpdate = true;

      // Expandir Shockwave
      shockwaveMesh.scale.x += delta * 80;
      shockwaveMesh.scale.y += delta * 80;
      shockwaveMesh.material.opacity = Math.max(0, shockwaveMesh.material.opacity - delta * 1.5);
      shockwaveMesh.lookAt(camera.position);
      break;

    case 'GALAXY':
      if (galaxyProgress < 1) {
        galaxyProgress += delta * 0.15; 
        const easeG = 1 - Math.pow(1 - galaxyProgress, 4); 
        
        for (let i = 0; i < numParticles * 3; i++) {
          posiciones[i] += (galaxyPositions[i] - posiciones[i]) * easeG * 0.1;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      } else {
        for (let i = 0; i < numParticles; i++) {
          posiciones[i*3 + 1] = galaxyPositions[i*3 + 1] + Math.sin(timeElapsed * 1.5 + i) * 6;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      }
      
      bloomPass.strength -= (bloomPass.strength - 1.5) * 0.05;

      const starsPos = shootingStarsSystem.geometry.attributes.position.array;
      for(let i=0; i<numShootingStars; i++){
        starsPos[i*3 + 2] += shootingStarsVelocities[i]; 
        if(starsPos[i*3 + 2] > 1000) { 
          starsPos[i*3 + 2] = -3000;
          starsPos[i*3] = (Math.random() - 0.5) * 4000;
          starsPos[i*3+1] = (Math.random() - 0.5) * 4000;
        }
      }
      shootingStarsSystem.geometry.attributes.position.needsUpdate = true;
      break;
  }

  controls.update();
  composer.render();
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
