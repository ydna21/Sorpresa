<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#030108">
<title>El Núcleo de Nuestro Universo ✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500;1,600&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root { --rose:#ff7eb6; --blush:#ffd6e7; --cyan:#7ff3ff; --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
          --glass:rgba(16,4,24,.6); --line:rgba(127,243,255,.35); }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:#030108; overflow:hidden; font-family:var(--sans); color:#fff; -webkit-font-smoothing:antialiased; }

  #canvasContainer { position:fixed; inset:0; z-index:1; touch-action:none; }
  #canvasContainer canvas { display:block; }
  #vineta { position:fixed; inset:0; z-index:9; pointer-events:none; background:radial-gradient(ellipse at center, transparent 55%, rgba(3,1,8,.7) 100%); }
  #ui-layer { position:fixed; inset:0; z-index:10; pointer-events:none; }

  /* Intro */
  #intro-screen {
    position:fixed; inset:0; z-index:20; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:22px; padding:28px; text-align:center;
    background:radial-gradient(ellipse at 50% 45%, rgba(48,10,56,.88) 0%, rgba(8,2,16,.96) 60%, #030108 100%);
    transition:opacity 2s ease, transform 2s ease;
  }
  #intro-screen.salir { opacity:0; transform:scale(1.12); pointer-events:none; }
  .glitch { font:italic 600 clamp(2rem,6.5vw,3.6rem)/1.1 var(--serif); color:#fff; text-shadow:0 0 30px rgba(255,45,138,.8), 0 0 70px rgba(138,43,226,.6); animation:pulsate 3s ease-in-out infinite alternate; }
  @keyframes pulsate { from { transform:scale(1); opacity:.85; } to { transform:scale(1.04); opacity:1; } }
  #intro-screen p { margin:0; max-width:420px; font-weight:300; font-size:clamp(.95rem,2.6vw,1.1rem); line-height:1.7; color:rgba(255,214,231,.75); }
  #btnAdentrarse {
    margin-top:10px; padding:16px 44px; font-size:.95rem; font-weight:500; letter-spacing:.2em; text-transform:uppercase; color:#fff; cursor:pointer;
    background:linear-gradient(135deg, rgba(255,45,138,.25), rgba(138,43,226,.25)); border:1px solid rgba(255,126,182,.7); border-radius:60px;
    box-shadow:0 0 30px rgba(255,45,138,.45), inset 0 0 20px rgba(255,45,138,.25); transition:all .4s ease; animation:latido 2.6s ease-in-out infinite;
  }
  #btnAdentrarse:hover { background:#ff2d8a; box-shadow:0 0 55px rgba(255,45,138,.9); transform:scale(1.06); }
  @keyframes latido { 50% { transform:scale(1.04); } }

  /* Mensajes */
  #mensaje-secreto {
    position:absolute; left:50%; bottom:max(14%, env(safe-area-inset-bottom) + 70px); transform:translate(-50%, 8px); width:90%; max-width:720px; text-align:center;
    font:italic 500 clamp(1.4rem,4.4vw,2.3rem)/1.4 var(--serif); color:#fff; text-shadow:0 0 22px rgba(255,45,138,.85), 0 2px 16px rgba(0,0,0,.8);
    opacity:0; transition:opacity 1.2s ease, transform 1.2s ease;
  }
  #mensaje-secreto.on { opacity:1; transform:translate(-50%, 0); }

  #hud {
    position:absolute; top:max(18px, env(safe-area-inset-top) + 8px); left:50%; transform:translate(-50%,-10px); opacity:0; white-space:nowrap;
    padding:9px 20px; border-radius:40px; background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    font-weight:300; font-size:.9rem; letter-spacing:.03em; color:var(--blush); transition:opacity 1s, transform 1s;
  }
  #hud.on { opacity:1; transform:translate(-50%,0); }
  #hud b { color:#fff; font-weight:500; }

  #modal-constelacion {
    position:absolute; top:max(80px, env(safe-area-inset-top) + 64px); left:50%; transform:translate(-50%,-14px) scale(.97); max-width:88vw; padding:20px 34px; text-align:center;
    font:italic 500 clamp(1.3rem,4.2vw,1.9rem)/1.35 var(--serif); color:#fff; text-shadow:0 0 16px rgba(127,243,255,.6); border-radius:24px;
    background:var(--glass); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 0 50px rgba(127,243,255,.3), inset 0 1px 0 rgba(255,255,255,.15); opacity:0; visibility:hidden;
    transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1), visibility 0s .5s;
  }
  #modal-constelacion.show { opacity:1; visibility:visible; transform:translate(-50%,0) scale(1); transition:opacity .5s ease, transform .6s cubic-bezier(.2,.8,.2,1); }

  #flash-screen { position:fixed; inset:0; z-index:15; pointer-events:none; opacity:0; background:radial-gradient(circle,#fff 0%,#ffd0e6 55%,#ff8fc4 100%); }

  #texto-final-absoluto {
    position:fixed; inset:0; z-index:30; display:none; flex-direction:column; align-items:center; justify-content:center; padding:28px; text-align:center;
    opacity:0; transition:opacity 4s ease;
  }
  #texto-final-absoluto p { margin:0; max-width:760px; font:italic 600 clamp(1.7rem,5.5vw,3rem)/1.4 var(--serif); color:#fff; text-shadow:0 0 28px rgba(255,45,138,.9), 0 0 60px rgba(255,255,255,.4); }
  .btn-volver {
    margin-top:42px; padding:13px 32px; border-radius:40px; cursor:pointer; font-size:.95rem; font-weight:500; letter-spacing:.06em; color:#fff;
    background:var(--glass); border:1px solid rgba(255,126,182,.6); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); transition:all .3s;
  }
  .btn-volver:hover, .btn-volver:focus-visible { background:#ff2d8a; box-shadow:0 0 40px rgba(255,45,138,.8); transform:scale(1.06); outline:none; }
</style>
</head>
<body>

<audio id="musicaSecreta" loop preload="auto"><source src="videos/musicasecreto.mp3" type="audio/mpeg"></audio>

<div id="canvasContainer"></div>
<div id="flash-screen"></div>
<div id="vineta"></div>

<div id="ui-layer">
  <div id="hud"></div>
  <div id="mensaje-secreto"></div>
  <div id="modal-constelacion">Mensaje estelar</div>
</div>

<div id="texto-final-absoluto">
  <p>Y si el universo se apagara, volvería a elegirte una y mil veces, te amo mi vida ❤️</p>
  <button class="btn-volver" id="btnVolver">Volver contigo</button>
</div>

<div id="intro-screen">
  <div class="glitch">Has descubierto el núcleo oculto…</div>
  <button id="btnAdentrarse">Desatar el universo</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ============ Utilidades ============ */
const esCelular = window.innerWidth < 768;
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeInOut = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const smooth = (k, dt) => 1 - Math.exp(-k * dt);

const textosSecretos = [
  "Aquí, en el centro absoluto de todo...", "Donde el tiempo se detiene...", "Cada estrella es un momento a tu lado.",
  "Incluso en el caos, te encuentro. Tu luz ilumina mi oscuridad.", "Eres la energía que mueve mi mundo. Más allá del espacio y del tiempo...",
  "Mi alma orbita alrededor de la tuya.", "Este es el núcleo de nuestro universo.", "Tú eres mi destino final. ❤️"
];
const mensajesConstelaciones = [
  "Eres mi luz en la oscuridad ✨", "Gracias por cada sonrisa compartida", "Mi recuerdo favorito es cualquiera contigo", "Nuestra historia está escrita en las estrellas",
  "Cada latido de este universo es tuyo", "Atravesaría galaxias solo para verte", "Haces que mi mundo gire", "Contigo el infinito se queda corto",
  "Mi constelación favorita son tus ojos", "Eres la gravedad que me mantiene a salvo"
];

const numParticles = esCelular ? 6000 : 14000;
const numWarpLines = esCelular ? 200 : 500;

/* ============ Estado ============ */
let scene, camera, renderer, composer, bloomPass, controls;
let audioCtx, analyser, dataArray, beat = 0;
let particleSystem, particleGeometry, warpLines, shockwave, agujero;
let currentPositions, heartPositions, explosionVelocities, galaxyPositions, colorsArray;
const interactiveStars = [];
const mainGroup = new THREE.Group();
const raycaster = new THREE.Raycaster(), ndc = new THREE.Vector2();
const clock = new THREE.Clock();
let animState = 'IDLE', morphProgress = 0, galaxyTimer = 0, timeElapsed = 0, warpT = 0, preT = 0, shockR = 0;
let warpOpacityTarget = 0, hoverPendiente = false, hoverStar = null, activeStar = null, descubiertas = 0, timeoutModal = 0;
let rotCur = .6, tex = {}, morphActive = false, pullT = 1, pullStart = 400, halo;

// Latido de corazón "lub-dub": dos golpes por ciclo (devuelve 0..1)
function latido(t) {
  const p = (t % .9) / .9, g = (x, c, w) => Math.exp(-Math.pow((x - c) / w, 2));
  return Math.min(1, g(p, .06, .05) + .7 * g(p, .31, .05));
}

function textura(tipo) {
  if (tex[tipo]) return tex[tipo];
  const c = document.createElement('canvas'), s = tipo === 'dot' ? 64 : 128; c.width = c.height = s;
  const g = c.getContext('2d'), r = s / 2, grad = g.createRadialGradient(r, r, 0, r, r, r);
  if (tipo === 'dot') { grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(.3, 'rgba(255,255,255,.7)'); grad.addColorStop(1, 'rgba(255,255,255,0)'); }
  else { grad.addColorStop(0, 'rgba(255,255,255,1)'); grad.addColorStop(.12, 'rgba(255,255,255,.7)'); grad.addColorStop(.4, 'rgba(255,255,255,.14)'); grad.addColorStop(1, 'rgba(255,255,255,0)'); }
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  if (tipo === 'star') { // destello en cruz
    [[0, r, s, r], [r, 0, r, s]].forEach(l => { const lg = g.createLinearGradient(l[0], l[1], l[2], l[3]); lg.addColorStop(0, 'rgba(255,255,255,0)'); lg.addColorStop(.5, 'rgba(255,255,255,.9)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); g.strokeStyle = lg; g.lineWidth = 1.5; g.beginPath(); g.moveTo(l[0], l[1]); g.lineTo(l[2], l[3]); g.stroke(); });
  }
  return tex[tipo] = new THREE.CanvasTexture(c);
}

/* ============ Inicio ============ */
function init() {
  scene = new THREE.Scene(); scene.background = new THREE.Color(0x030108);
  camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 1, 20000);
  camera.position.set(0, 0, 4000);

  renderer = new THREE.WebGLRenderer({ antialias: !esCelular, powerPreference: 'high-performance' });
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, esCelular ? 1.5 : 2));
  $('canvasContainer').appendChild(renderer.domElement);

  composer = new THREE.EffectComposer(renderer);
  composer.addPass(new THREE.RenderPass(scene, camera));
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.0, 0.6, 0.12);
  composer.addPass(bloomPass);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  Object.assign(controls, { enableDamping: true, dampingFactor: .05, enableZoom: false, autoRotate: true, autoRotateSpeed: .6, rotateSpeed: .6, enablePan: false, maxPolarAngle: Math.PI / 1.5 });

  prepararMatematicas(); crearParticulas(); crearWarp(); crearOnda(); crearFondo();
  scene.add(mainGroup);

  const el = renderer.domElement; let down = null;
  el.addEventListener('pointerdown', e => { down = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  el.addEventListener('pointerup', e => {
    if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8 && performance.now() - down.t < 600) pick(e.clientX, e.clientY);
    down = null;
  });
  el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); hoverPendiente = true; } });
}

function crearFondo() { // estrellas lejanas + nebulosas suaves
  const n = esCelular ? 1500 : 4000, pos = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) {
    const r = 7000 + Math.random() * 8000, th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos.set([r * Math.sin(ph) * Math.cos(th), r * Math.cos(ph), r * Math.sin(ph) * Math.sin(th)], i * 3);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size: 2.4, map: textura('dot'), color: 0xcfd8ff, transparent: true, opacity: .8, depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: false })));
  [0xff2d8a, 0x6a3cff, 0x20a8ff, 0xb02cff].forEach((c, i) => {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textura('glow') || textura('star'), color: c, transparent: true, opacity: .12, blending: THREE.AdditiveBlending, depthWrite: false }));
    const a = i * 1.7 + .5; s.position.set(Math.cos(a) * 8000, (Math.random() - .5) * 4000, Math.sin(a) * 8000); s.scale.setScalar(7000); scene.add(s);
  });
}

function prepararMatematicas() {
  const N = numParticles;
  currentPositions = new Float32Array(N * 3); heartPositions = new Float32Array(N * 3); explosionVelocities = new Float32Array(N * 3);
  galaxyPositions = new Float32Array(N * 3); colorsArray = new Float32Array(N * 3);
  const cPink = new THREE.Color(0xff2d8a), cCyan = new THREE.Color(0x35e6ff), cGold = new THREE.Color(0xffd36a), cWhite = new THREE.Color(0xffffff), cViolet = new THREE.Color(0xa86bff);
  const v = new THREE.Vector3();

  for (let i = 0; i < N; i++) {
    const i3 = i * 3;
    const R = 4000 + Math.random() * 2000, th = Math.random() * Math.PI * 2, ph = Math.acos(Math.random() * 2 - 1);
    currentPositions.set([R * Math.sin(ph) * Math.cos(th), R * Math.sin(ph) * Math.sin(th), R * Math.cos(ph)], i3);

    const t = Math.random() * Math.PI * 2, xH = 16 * Math.pow(Math.sin(t), 3);
    const yH = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
    const eH = esCelular ? 6 : 10, dist = Math.hypot(xH, yH), vol = Math.max(0, 1 - dist / 16);
    const rel = Math.pow(Math.random(), .6); // relleno interior
    const disp = (Math.random() - .5) * 15;
    heartPositions.set([xH * eH * (rel * .35 + .65) + disp, yH * eH * (rel * .35 + .65) + disp, (Math.random() - .5) * 80 * vol + disp], i3);

    v.set(heartPositions[i3], heartPositions[i3 + 1], heartPositions[i3 + 2]).normalize();
    const sp = 40 + Math.random() * 100;
    explosionVelocities.set([v.x * sp, v.y * sp, v.z * sp + (Math.random() - .5) * 30], i3);

    const brazos = 4, off = (i % brazos) * (Math.PI * 2 / brazos), rG = Math.pow(Math.random(), .8) * 1000, aG = rG * .015 + off;
    const dG = (1000 - rG) * .1 * (Math.random() - .5), hG = (Math.random() - .5) * 80 * (1 - rG / 1000);
    galaxyPositions.set([Math.cos(aG) * rG + dG, hG, Math.sin(aG) * rG + dG], i3);

    const q = Math.random();
    let c = q < .45 ? cPink : q < .75 ? cCyan : q < .9 ? cViolet : cWhite;
    if (rG < 150 || dist < 5) c = cGold;
    const b = .7 + Math.random() * .3; colorsArray.set([c.r * b, c.g * b, c.b * b], i3);
  }
}

function crearParticulas() {
  particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions.slice(), 3));
  particleGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));
  particleSystem = new THREE.Points(particleGeometry, new THREE.PointsMaterial({
    size: esCelular ? 6 : 8, map: textura('dot'), transparent: true, opacity: .95, vertexColors: true, blending: THREE.AdditiveBlending, depthWrite: false
  }));
  particleSystem.frustumCulled = false; mainGroup.add(particleSystem);
  halo = new THREE.Sprite(new THREE.SpriteMaterial({ map: textura('glow'), color: 0xff2d8a, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  halo.scale.setScalar(850); mainGroup.add(halo);
}

function crearWarp() {
  const pos = new Float32Array(numWarpLines * 6);
  for (let i = 0; i < numWarpLines; i++) {
    const x = (Math.random() - .5) * 4000, y = (Math.random() - .5) * 4000, z = Math.random() * 4000 - 2000;
    pos.set([x, y, z, x, y, z + 120], i * 6);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  warpLines = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ color: 0xcfe9ff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
  warpLines.frustumCulled = false; scene.add(warpLines);
}

function crearOnda() {
  shockwave = new THREE.Mesh(new THREE.RingGeometry(.88, 1, 128), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  shockwave.scale.setScalar(.001); scene.add(shockwave);
}

function generarEstrellasInteractivas() {
  const tints = [0xffffff, 0xffb3d9, 0xb8f4ff];
  for (let i = 0; i < 10; i++) {
    const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: textura('star'), color: tints[i % 3], transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false }));
    const ang = i * 2.399 + Math.random() * .4, rad = 260 + ((i * 7) % 10) / 10 * 620 + Math.random() * 50;
    s.position.set(Math.cos(ang) * rad, (Math.random() - .5) * 100, Math.sin(ang) * rad);
    s.userData = { mensaje: mensajesConstelaciones[i], base: 140, size: 0, boost: 0, vista: false, fase: Math.random() * 6 };
    s.scale.setScalar(.01); interactiveStars.push(s); mainGroup.add(s);
  }
  actualizarHud();
}

function actualizarHud() { const h = $('hud'); h.innerHTML = `Toca las estrellas brillantes · <b>${descubiertas} de ${interactiveStars.length}</b>`; h.classList.add('on'); }

/* ============ Interacción ============ */
function pick(x, y) {
  if (animState !== 'GALAXY') return;
  ndc.set(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1); raycaster.setFromCamera(ndc, camera);
  const hit = raycaster.intersectObjects(interactiveStars);
  if (!hit.length) return;
  const s = hit[0].object, d = s.userData, modal = $('modal-constelacion');
  modal.textContent = d.mensaje; modal.classList.add('show');
  clearTimeout(timeoutModal); timeoutModal = setTimeout(() => modal.classList.remove('show'), 4000);
  d.boost = 1.2;
  if (!d.vista) { d.vista = true; d.base = 165; s.material.color.setHex(0xffe08a); descubiertas++; actualizarHud(); }
}

/* ============ Secuencia ============ */
$('btnAdentrarse').addEventListener('click', () => {
  const audio = $('musicaSecreta');
  if (location.protocol !== 'file:') { // el análisis real solo funciona con http(s)
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 256;
      const src = audioCtx.createMediaElementSource(audio); src.connect(analyser); analyser.connect(audioCtx.destination);
      dataArray = new Uint8Array(analyser.frequencyBinCount);
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { analyser = null; }
  }
  audio.volume = 0; audio.play().catch(() => {});
  const fade = setInterval(() => { audio.volume = Math.min(1, audio.volume + .04); if (audio.volume >= 1) clearInterval(fade); }, 120);

  $('intro-screen').classList.add('salir'); setTimeout(() => { $('intro-screen').style.display = 'none'; }, 2100);
  animState = 'WARP_IN'; warpT = 0; warpOpacityTarget = .6;
});

$('btnVolver').addEventListener('click', () => { history.length > 1 ? history.back() : (location.href = 'index.html'); });

function escribirMensajePoetico() {
  const div = $('mensaje-secreto'); let i = 0;
  (function siguiente() {
    if (i >= textosSecretos.length) { setTimeout(() => { div.classList.remove('on'); desatarSupernova(); }, 3000); return; }
    div.classList.remove('on');
    setTimeout(() => { div.textContent = textosSecretos[i++]; div.classList.add('on'); setTimeout(siguiente, 4500); }, 1100);
  })();
}

function desatarSupernova() {
  animState = 'PRE_EXPLOSION'; preT = 0;
  setTimeout(() => {
    animState = 'EXPLOSION'; shockR = 0; shockwave.material.opacity = 1;
    pullT = 0; pullStart = camera.position.length();
    const f = $('flash-screen'); f.style.transition = 'none'; f.style.opacity = '1';
    requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = 'opacity 2.5s ease'; f.style.opacity = '0'; }));
    setTimeout(() => { animState = 'GALAXY'; warpOpacityTarget = .5; generarEstrellasInteractivas(); }, 2000);
  }, 3000);
}

function lanzarAgujero() {
  animState = 'BLACK_HOLE'; warpOpacityTarget = 0; $('hud').classList.remove('on'); $('modal-constelacion').classList.remove('show');
  agujero = new THREE.Group();
  const disco = new THREE.Mesh(new THREE.RingGeometry(45, 190, 96), new THREE.MeshBasicMaterial({ color: 0xff6fb0, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
  disco.rotation.x = Math.PI / 2.3; agujero.add(disco, new THREE.Mesh(new THREE.SphereGeometry(38, 24, 24), new THREE.MeshBasicMaterial({ color: 0x000000 })));
  agujero.userData.disco = disco; mainGroup.add(agujero);
}

/* ============ Bucle ============ */
function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), .05); timeElapsed += dt;
  const pos = particleGeometry.attributes.position.array, N3 = numParticles * 3;

  // Latido: audio real o simulado
  let tgt;
  if (analyser && dataArray) { analyser.getByteFrequencyData(dataArray); let s = 0; for (let i = 0; i < 20; i++) s += dataArray[i]; tgt = s / 20 / 255; }
  else tgt = .55 * Math.pow(Math.max(0, Math.sin(timeElapsed * 2.6)), 6);
  beat += (tgt - beat) * smooth(12, dt);
  const pulse = latido(timeElapsed), amp = clamp(morphProgress * 2, 0, 1); // el latido va ganando fuerza mientras se forma el corazón

  // Formación del corazón: arranca al final del viaje, cuando aparece el primer mensaje
  if (morphActive && morphProgress < 1) {
    morphProgress = Math.min(1, morphProgress + dt * .14);
    const e = 1 - Math.pow(1 - morphProgress, 3);
    for (let i = 0; i < N3; i++) pos[i] = currentPositions[i] + (heartPositions[i] - currentPositions[i]) * e;
    particleGeometry.attributes.position.needsUpdate = true;
  }

  let bloomT = 1, bloomRate = 2.5, rotT = .6;

  switch (animState) {
    case 'WARP_IN': {
      warpT += dt / 3.8; const t = clamp(warpT, 0, 1);
      camera.position.setLength(THREE.MathUtils.lerp(4000, 720, easeInOut(t)));
      camera.fov = 60 + Math.sin(t * Math.PI) * 35; camera.updateProjectionMatrix();
      bloomT = 1.3; rotT = 3;
      if (t > .6) morphActive = true;
      if (morphActive) mainGroup.scale.setScalar(1 + amp * .15 * pulse);
      if (t >= 1) {
        camera.fov = 60; camera.updateProjectionMatrix(); warpOpacityTarget = 0;
        controls.enableZoom = true; controls.minDistance = 200; controls.maxDistance = 2000;
        animState = 'MORPH_HEART'; escribirMensajePoetico();
      }
      break;
    }
    case 'MORPH_HEART': {
      mainGroup.scale.setScalar(1 + amp * .15 * pulse + beat * .04); bloomT = 1.3 + pulse * 1.1 * amp; bloomRate = 9; rotT = 1.5;
      if (morphProgress >= 1) animState = 'HEARTBEAT';
      break;
    }
    case 'HEARTBEAT':
      mainGroup.scale.setScalar(1 + .15 * pulse + beat * .08); bloomT = 1.4 + pulse * 1.2 + beat * 1.2; bloomRate = 9; rotT = 1.5; break;
    case 'PRE_EXPLOSION': {
      preT += dt; const amp = Math.min(.45, .08 + preT * .14), s = 1 + Math.max(0, Math.sin(timeElapsed * 20)) * amp;
      mainGroup.scale.setScalar(s); bloomT = 7; bloomRate = 1.3; rotT = 20; break;
    }
    case 'EXPLOSION': {
      mainGroup.scale.setScalar(1); bloomT = 5; bloomRate = 3; rotT = 12;
      for (let i = 0; i < N3; i++) pos[i] += explosionVelocities[i] * dt * 2.5;
      particleGeometry.attributes.position.needsUpdate = true;
      shockR += dt * 1800 * (1 - clamp(shockR / 4500, 0, .8)); shockwave.scale.setScalar(Math.max(shockR, .001));
      shockwave.material.opacity = Math.max(0, shockwave.material.opacity - dt * 1.1); shockwave.lookAt(camera.position);
      break;
    }
    case 'GALAXY': {
      galaxyTimer += dt;
      const e = 1 - Math.pow(1 - clamp(galaxyTimer / 5, 0, 1), 4), k = 1 - Math.exp(-6 * Math.max(e, .02) * dt), amp = clamp(galaxyTimer / 5, 0, 1) * 6;
      for (let i = 0; i < numParticles; i++) {
        const j = i * 3;
        pos[j] += (galaxyPositions[j] - pos[j]) * k;
        pos[j + 1] += (galaxyPositions[j + 1] + Math.sin(timeElapsed * 1.5 + i) * amp - pos[j + 1]) * k;
        pos[j + 2] += (galaxyPositions[j + 2] - pos[j + 2]) * k;
      }
      particleGeometry.attributes.position.needsUpdate = true;
      mainGroup.scale.setScalar(1 + beat * .05); bloomT = 1.2 + beat; rotT = 2;
      if (galaxyTimer > 60) lanzarAgujero();
      break;
    }
    case 'BLACK_HOLE': {
      const g = Math.pow(.94, dt * 60), ang = dt * 5, cs = Math.cos(ang), sn = Math.sin(ang);
      for (let i = 0; i < numParticles; i++) {
        const j = i * 3, x = pos[j], z = pos[j + 2];
        pos[j] = (x * cs - z * sn) * g; pos[j + 1] *= g; pos[j + 2] = (x * sn + z * cs) * g;
      }
      particleGeometry.attributes.position.needsUpdate = true;
      const d = agujero.userData.disco; d.material.opacity = Math.min(.85, d.material.opacity + dt * .6); d.rotation.z += dt * 6;
      mainGroup.scale.multiplyScalar(Math.pow(.985, dt * 60)); bloomT = .08; bloomRate = 1.6; rotT = 40;
      if (mainGroup.scale.x < .01) {
        animState = 'END'; const t = $('texto-final-absoluto'); t.style.display = 'flex'; setTimeout(() => t.style.opacity = '1', 100);
      }
      break;
    }
  }

  // Halo rosado detrás del corazón: pulsa con cada latido y se apaga al explotar
  const conCorazon = animState === 'MORPH_HEART' || animState === 'HEARTBEAT' || animState === 'PRE_EXPLOSION' || (animState === 'WARP_IN' && morphActive);
  halo.material.opacity += ((conCorazon ? (.1 + .3 * pulse) * amp : 0) - halo.material.opacity) * smooth(10, dt);
  halo.scale.setScalar(850 * (1 + .12 * pulse));

  // Tras la explosión la cámara se aleja un poco para ver la galaxia y las estrellas
  if (pullT < 1) {
    pullT = Math.min(1, pullT + dt / 5); const e = easeInOut(pullT);
    camera.position.setLength(THREE.MathUtils.lerp(pullStart, 1300, e));
    particleSystem.material.size = (esCelular ? 6 : 8) * (1 + .7 * e); // las partículas se mantienen visibles de lejos
  }

  // Suavizados globales (nada "salta" entre estados)
  bloomPass.strength += (bloomT - bloomPass.strength) * smooth(bloomRate, dt);
  rotCur += (rotT - rotCur) * smooth(2.5, dt);
  controls.autoRotateSpeed = rotCur * dt * 60; // OrbitControls r128 rota por frame: lo hacemos independiente de los FPS

  // Líneas warp
  const wm = warpLines.material; wm.opacity += (warpOpacityTarget - wm.opacity) * smooth(2, dt);
  if (wm.opacity > .01) {
    const lp = warpLines.geometry.attributes.position.array, sp = (animState === 'WARP_IN' ? 5000 : 2400 + beat * 3600) * dt;
    for (let i = 0; i < numWarpLines; i++) {
      const b = i * 6; lp[b + 2] += sp; lp[b + 5] += sp;
      if (lp[b + 2] > 1000) { const x = (Math.random() - .5) * 4000, y = (Math.random() - .5) * 4000; lp.set([x, y, -3000, x, y, -2850], b); }
    }
    warpLines.geometry.attributes.position.needsUpdate = true;
  }

  // Estrellas interactivas
  if (interactiveStars.length) {
    if (hoverPendiente && animState === 'GALAXY') {
      hoverPendiente = false; raycaster.setFromCamera(ndc, camera);
      const h = raycaster.intersectObjects(interactiveStars); hoverStar = h.length ? h[0].object : null;
      renderer.domElement.style.cursor = hoverStar ? 'pointer' : 'grab';
    }
    const visible = animState === 'GALAXY';
    interactiveStars.forEach(s => {
      const d = s.userData; d.boost += (0 - d.boost) * smooth(3, dt);
      const pulso = 1 + .14 * Math.sin(timeElapsed * 2 + d.fase), obj = d.base * pulso * (hoverStar === s ? 1.35 : 1) * (1 + d.boost);
      d.size += ((visible ? obj : 0) - d.size) * smooth(6, dt); s.scale.setScalar(Math.max(d.size, .01));
      s.material.opacity += ((visible ? 1 : 0) - s.material.opacity) * smooth(2.5, dt);
    });
  }

  controls.update(); composer.render();
}

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});

document.addEventListener('visibilitychange', () => {
  const a = $('musicaSecreta');
  if (document.hidden) a.pause(); else if (animState !== 'IDLE' && animState !== 'END') a.play().catch(() => {});
});

init(); animate();
</script>
</body>
</html>
