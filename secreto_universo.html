<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El Núcleo de Nuestro Universo ✨</title>
<style>
  body { margin: 0; background: #000; overflow: hidden; font-family: 'Courier New', monospace; color: white; }
  
  #canvasContainer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
  
  #ui-layer {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: center; pointer-events: none;
  }

  #intro-screen {
    background: rgba(0, 0, 0, 0.95);
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 20; transition: opacity 2s ease;
  }

  .glitch {
    font-size: 2.2rem; font-weight: bold; color: #fff;
    text-shadow: 0 0 10px #ff1493, 0 0 20px #8a2be2;
    text-align: center; padding: 20px;
    animation: pulsate 2s infinite alternate;
  }

  @keyframes pulsate {
    0% { transform: scale(1); opacity: 0.8; text-shadow: 0 0 10px #ff1493; }
    100% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 30px #ff69b4, 0 0 40px #00ffff; }
  }

  #btnAdentrarse {
    margin-top: 30px; padding: 15px 40px; font-size: 1.2rem;
    background: transparent; color: white; border: 2px solid #ff1493;
    border-radius: 50px; cursor: pointer; pointer-events: auto;
    box-shadow: 0 0 15px #ff1493 inset, 0 0 20px #ff1493;
    transition: all 0.5s ease; text-transform: uppercase; letter-spacing: 2px;
  }
  #btnAdentrarse:hover { background: #ff1493; box-shadow: 0 0 40px #ff1493; transform: scale(1.1); }

  #mensaje-secreto {
    position: absolute; bottom: 15%; width: 90%; max-width: 700px;
    text-align: center; font-size: 1.5rem; line-height: 1.6;
    color: #fff; text-shadow: 0 0 15px #ff1493, 0 0 30px #ff69b4;
    opacity: 0; transition: opacity 2s ease; font-weight: bold;
  }

  #flash-screen {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: white; z-index: 15; opacity: 0; pointer-events: none;
  }

  /* MODAL DE CONSTELACIONES */
  #modal-constelacion {
    position: absolute; top: 20%; background: rgba(10, 0, 20, 0.85);
    border: 2px solid #00ffff; padding: 20px 40px; border-radius: 15px;
    box-shadow: 0 0 30px #00ffff; color: #fff; text-align: center;
    font-size: 1.3rem; z-index: 12; display: none; opacity: 0; transition: opacity 0.5s;
  }

  /* TEXTO FINAL DEL AGUJERO NEGRO */
  #texto-final-absoluto {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 90%; max-width: 800px; text-align: center;
    font-size: 2rem; line-height: 1.5; font-weight: bold;
    color: #fff; text-shadow: 0 0 20px #ff1493, 0 0 40px #fff;
    z-index: 30; display: none; opacity: 0; transition: opacity 4s ease;
  }

  .btn-volver {
    margin-top: 40px; padding: 12px 30px;
    background: rgba(255, 20, 147, 0.2); border: 2px solid #ff69b4;
    color: white; border-radius: 25px; font-family: inherit; font-size: 1.1rem;
    cursor: pointer; pointer-events: auto; transition: transform 0.3s;
    box-shadow: 0 0 20px rgba(255,105,180,0.5); font-weight: bold;
  }
  .btn-volver:hover { background: #ff1493; transform: scale(1.1); box-shadow: 0 0 40px #ff69b4; }
</style>
</head>
<body>

<audio id="musicaSecreta" loop crossorigin="anonymous">
  <source src="videos/musicasecreto.mp3" type="audio/mpeg">
</audio>

<div id="canvasContainer"></div>
<div id="flash-screen"></div>

<div id="ui-layer">
  <div id="mensaje-secreto"></div>
  <div id="modal-constelacion">Mensaje estelar</div>
</div>

<div id="texto-final-absoluto">
  Y si el universo se apagara, volvería a elegirte una y mil veces, te amo mi vida ❤️<br>
  <button class="btn-volver" onclick="window.history.back()">Volver Contigo</button>
</div>

<div id="intro-screen">
  <div class="glitch">Has descubierto el núcleo oculto...</div>
  <p style="color: #ccc; text-align: center; max-width: 80%; font-size:1.1rem; line-height: 1.5;">
    El sistema requiere control total.<br>Prepárate para la inmersión.
  </p>
  <button id="btnAdentrarse">Desatar el Universo</button>
</div>

<!-- Scripts de Three.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
// --- CONFIGURACIÓN TÉCNICA ---
const esCelular = window.innerWidth < 768;
let scene, camera, renderer, composer, bloomPass, controls;
let audioCtx, analyser, dataArray;

// Sistemas de partículas y efectos
let particleSystem, particleGeometry;
let currentPositions, heartPositions, explosionVelocities, galaxyPositions, colorsArray;
let warpLinesSystem; // Reemplazo de los puntos por líneas de luz
let shockwaveMesh; 
let interactiveStars = []; // Estrellas clicleables

// NUEVAS VARIABLES PARA CONTROLAR LOS TIEMPOS DE LOS CLICS
let timeoutFade;
let timeoutOcultar;
let estrellaActiva = null;

const numParticles = esCelular ? 6000 : 12000;
const numWarpLines = esCelular ? 200 : 500;

// Interacción
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

// Máquina de estados 
let animState = 'IDLE'; 
let morphProgress = 0;
let galaxyTimer = 0;
let clock = new THREE.Clock();
let timeElapsed = 0;

let mainGroup = new THREE.Group();
mainGroup.frustumCulled = false; // EVITA QUE DESAPAREZCAN AL GIRAR

const textosSecretos = [
  "Aquí, en el centro absoluto de todo...",
  "Donde el tiempo se detiene...",
  "Cada estrella es un momento a tu lado.",
  "Incluso en el caos, te encuentro. Tu luz ilumina mi oscuridad.",
  "Eres la energía que mueve mi mundo. Más allá del espacio y del tiempo...",
  "Mi alma orbita alrededor de la tuya.",
  "Este es el núcleo de nuestro universo.",
  "Tú eres mi destino final. ❤️"
];

const mensajesConstelaciones = [
  "Eres mi luz en la oscuridad ✨",
  "Gracias por cada sonrisa compartida",
  "Mi recuerdo favorito es cualquiera contigo",
  "Nuestra historia está escrita en las estrellas",
  "Cada latido de este universo es tuyo",
  "Atravesaría galaxias solo para verte",
  "Haces que mi mundo gire",
  "Contigo el infinito se queda corto",
  "Mi constelación favorita son tus ojos",
  "Eres la gravedad que me mantiene a salvo"
];

init();
animate();

function init() {
  const container = document.getElementById('canvasContainer');
  scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x000000, 0.0003);

  camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 15000);
  camera.position.set(0, 0, 4000); 

  renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  container.appendChild(renderer.domElement);

  // Post-procesado (Glow Mágico)
  const renderScene = new THREE.RenderPass(scene, camera);
  bloomPass = new THREE.UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 2.0, 0.5, 0.1);
  composer = new THREE.EffectComposer(renderer);
  composer.addPass(renderScene);
  composer.addPass(bloomPass);

  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.05;
  controls.enableZoom = false; 
  controls.autoRotate = true;
  controls.autoRotateSpeed = 1.5;
  controls.maxPolarAngle = Math.PI / 1.5; 

  prepararMatematicas();
  crearSistemaParticulas();
  crearLluviaWarp();
  crearOndaExpansiva();
  
  scene.add(mainGroup);

  window.addEventListener('resize', onWindowResize);
  window.addEventListener('click', onStarClick);
  window.addEventListener('touchstart', (e) => {
    if(e.touches.length > 0) {
      mouse.x = (e.touches[0].clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.touches[0].clientY / window.innerHeight) * 2 + 1;
      onStarClick(e);
    }
  }, {passive: false});
}

function createStarTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 64; canvas.height = 64;
  const ctx = canvas.getContext('2d');
  const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
  gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
  gradient.addColorStop(0.2, 'rgba(255, 105, 180, 0.8)');
  gradient.addColorStop(0.5, 'rgba(138, 43, 226, 0.2)');
  gradient.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = gradient;
  ctx.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(canvas);
}

function crearOndaExpansiva() {
  const ringGeo = new THREE.RingGeometry(1, 15, 64);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0,
    side: THREE.DoubleSide, blending: THREE.AdditiveBlending
  });
  shockwaveMesh = new THREE.Mesh(ringGeo, ringMat);
  scene.add(shockwaveMesh);
}

function prepararMatematicas() {
  currentPositions = new Float32Array(numParticles * 3);
  heartPositions = new Float32Array(numParticles * 3);
  explosionVelocities = new Float32Array(numParticles * 3);
  galaxyPositions = new Float32Array(numParticles * 3);
  colorsArray = new Float32Array(numParticles * 3);

  const colorBase = new THREE.Color(0xff1493); 
  const colorAlt = new THREE.Color(0x00ffff);  
  const colorCore = new THREE.Color(0xffd700); 

  for (let i = 0; i < numParticles; i++) {
    const i3 = i * 3;
    
    // 1. INICIO (Nebulosa)
    const radioInicial = 4000 + Math.random() * 2000;
    const thetaInicial = Math.random() * Math.PI * 2;
    const phiInicial = Math.acos(Math.random() * 2 - 1);
    currentPositions[i3] = radioInicial * Math.sin(phiInicial) * Math.cos(thetaInicial);
    currentPositions[i3 + 1] = radioInicial * Math.sin(phiInicial) * Math.sin(thetaInicial);
    currentPositions[i3 + 2] = radioInicial * Math.cos(phiInicial);

    // 2. CORAZÓN 
    const t = Math.random() * Math.PI * 2; 
    let xH = 16 * Math.pow(Math.sin(t), 3);
    let yH = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
    const escalaH = esCelular ? 6 : 10;
    const distAlCentro = Math.sqrt(xH*xH + yH*yH);
    const factorVolumen = Math.max(0, 1 - (distAlCentro / 16));
    const zH = (Math.random() - 0.5) * 80 * factorVolumen;
    const dispersion = (Math.random() - 0.5) * 15;
    
    heartPositions[i3] = (xH * escalaH) + dispersion;
    heartPositions[i3 + 1] = (yH * escalaH) + dispersion;
    heartPositions[i3 + 2] = zH + dispersion;

    // 3. EXPLOSIÓN 
    const vel = new THREE.Vector3(heartPositions[i3], heartPositions[i3+1], heartPositions[i3+2]).normalize();
    const speed = 40 + Math.random() * 100;
    explosionVelocities[i3] = vel.x * speed;
    explosionVelocities[i3+1] = vel.y * speed;
    explosionVelocities[i3+2] = vel.z * speed + (Math.random() - 0.5)*30; 

    // 4. GALAXIA
    const brazos = 4;
    const armOffset = (i % brazos) * ((Math.PI * 2) / brazos);
    const radioG = Math.random() * 1000; 
    const angleG = (radioG * 0.015) + armOffset; 
    const dispersionG = (1000 - radioG) * 0.1 * (Math.random() - 0.5); 
    const alturaG = (Math.random() - 0.5) * 80 * (1 - (radioG/1000)); 

    galaxyPositions[i3] = Math.cos(angleG) * radioG + dispersionG;
    galaxyPositions[i3 + 1] = alturaG;
    galaxyPositions[i3 + 2] = Math.sin(angleG) * radioG + dispersionG;

    // COLORES
    let c = colorBase.clone();
    if (Math.random() > 0.5) c = colorAlt.clone();
    if (radioG < 150 || distAlCentro < 5) c = colorCore.clone(); 
    colorsArray[i3] = c.r;
    colorsArray[i3 + 1] = c.g;
    colorsArray[i3 + 2] = c.b;
  }
}

function crearSistemaParticulas() {
  particleGeometry = new THREE.BufferGeometry();
  particleGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));
  particleGeometry.setAttribute('color', new THREE.BufferAttribute(colorsArray, 3));

  const material = new THREE.PointsMaterial({
    size: esCelular ? 6 : 8,
    map: createStarTexture(),
    transparent: true, opacity: 0.9, vertexColors: true,
    blending: THREE.AdditiveBlending, depthWrite: false
  });

  particleSystem = new THREE.Points(particleGeometry, material);
  particleSystem.frustumCulled = false; // EVITA QUE DESAPAREZCAN AL GIRAR
  mainGroup.add(particleSystem);
}

// NUEVO: EFECTO WARP (Líneas de estelas)
function crearLluviaWarp() {
  const lineGeo = new THREE.BufferGeometry();
  const linePos = new Float32Array(numWarpLines * 6); // 2 vértices por línea
  
  for(let i=0; i<numWarpLines; i++){
    const x = (Math.random() - 0.5) * 4000;
    const y = (Math.random() - 0.5) * 4000;
    const z = Math.random() * 4000 - 2000;
    // Vertice Inicio
    linePos[i*6] = x; linePos[i*6+1] = y; linePos[i*6+2] = z;
    // Vertice Fin (Cola de la estrella)
    linePos[i*6+3] = x; linePos[i*6+4] = y; linePos[i*6+5] = z + 100; 
  }
  
  lineGeo.setAttribute('position', new THREE.BufferAttribute(linePos, 3));
  const lineMat = new THREE.LineBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending
  });
  
  warpLinesSystem = new THREE.LineSegments(lineGeo, lineMat);
  warpLinesSystem.frustumCulled = false; // EVITA QUE DESAPAREZCAN AL GIRAR
  scene.add(warpLinesSystem);
}

// ESTRELLAS CLIQUEABLES
function generarEstrellasInteractivas() {
  // Ahora son 10 estrellas interactivas
  for (let i = 0; i < 10; i++) {
    const tex = createStarTexture();
    const mat = new THREE.SpriteMaterial({ map: tex, color: 0xffffff, transparent: true, blending: THREE.AdditiveBlending });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(100, 100, 1);
    
    // Posicionar en los brazos de la galaxia
    const angle = Math.random() * Math.PI * 2;
    const radio = 300 + Math.random() * 600;
    sprite.position.set(Math.cos(angle)*radio, (Math.random()-0.5)*100, Math.sin(angle)*radio);
    
    sprite.userData = { mensaje: mensajesConstelaciones[i] };
    interactiveStars.push(sprite);
    mainGroup.add(sprite);
  }
}

// --- AUDIO REACTIVO Y PANTALLA COMPLETA ---
document.getElementById('btnAdentrarse').addEventListener('click', () => {
  // PANTALLA COMPLETA
  if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(e => console.log(e));
  }

  // AUDIO ANALYZER
  const audioEl = document.getElementById('musicaSecreta');
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    const source = audioCtx.createMediaElementSource(audioEl);
    source.connect(analyser);
    analyser.connect(audioCtx.destination);
    analyser.fftSize = 256;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  audioEl.play();

  document.getElementById('intro-screen').style.opacity = '0';
  setTimeout(() => { document.getElementById('intro-screen').style.display = 'none'; }, 2000);
  
  animState = 'WARP_IN';
  iniciarWarp();
});

// INTERACCIÓN DE CLIC EN GALAXIA
window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
});

// FUNCIÓN DE CLIC CORREGIDA PARA QUE LOS MENSAJES DUREN
function onStarClick(e) {
  if(animState !== 'GALAXY') return;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(interactiveStars);
  
  if (intersects.length > 0) {
    const estrellaTocada = intersects[0].object;
    const msg = estrellaTocada.userData.mensaje;
    const modal = document.getElementById('modal-constelacion');

    // 1. Cancelar los temporizadores anteriores para que no cierren el mensaje nuevo
    if (timeoutFade) clearTimeout(timeoutFade);
    if (timeoutOcultar) clearTimeout(timeoutOcultar);

    // 2. Restaurar el tamaño de la estrella anterior si tocas otra rápidamente
    if (estrellaActiva && estrellaActiva !== estrellaTocada) {
      estrellaActiva.scale.set(100, 100, 1);
    }
    estrellaActiva = estrellaTocada;

    // Mostrar el nuevo mensaje
    modal.innerText = msg;
    modal.style.display = 'block';
    setTimeout(()=> modal.style.opacity = '1', 10);
    
    // Destello de la estrella tocada
    estrellaTocada.scale.set(200, 200, 1);
    
    // 3. Crear los nuevos temporizadores y guardarlos
    timeoutFade = setTimeout(() => { 
      modal.style.opacity = '0'; 
      
      timeoutOcultar = setTimeout(() => {
          modal.style.display = 'none';
      }, 500);
      
      estrellaTocada.scale.set(100, 100, 1); // Regresa a tamaño normal
      estrellaActiva = null;
    }, 4000); 
  }
}

function iniciarWarp() {
  let warpInterval = setInterval(() => {
    camera.position.z -= (camera.position.z - 400) * 0.05;
    if (camera.position.z <= 410) {
      clearInterval(warpInterval);
      controls.enableZoom = true;
      controls.minDistance = 200;
      controls.maxDistance = 2000;
      animState = 'MORPH_HEART';
      escribirMensajePoetico();
    }
  }, 16);
}

function escribirMensajePoetico() {
  const divMensaje = document.getElementById('mensaje-secreto');
  divMensaje.style.opacity = '1';
  let index = 0;
  
  function siguienteLinea() {
    if (index >= textosSecretos.length) {
      setTimeout(() => {
        divMensaje.style.opacity = '0';
        desatarSupernova(); 
      }, 3000);
      return;
    }
    divMensaje.style.opacity = '0';
    setTimeout(() => {
      divMensaje.innerText = textosSecretos[index];
      divMensaje.style.opacity = '1';
      index++;
      setTimeout(siguienteLinea, 4500);
    }, 1000);
  }
  siguienteLinea();
}

function desatarSupernova() {
  animState = 'PRE_EXPLOSION';
  controls.autoRotateSpeed = 20.0; // Giro extremo
  
  setTimeout(() => {
    animState = 'EXPLOSION';
    shockwaveMesh.material.opacity = 1; // Anillo expansivo
    
    // Flash de pantalla
    const flash = document.getElementById('flash-screen');
    flash.style.opacity = '1'; 
    setTimeout(() => { flash.style.opacity = '0'; flash.style.transition = 'opacity 2.5s'; }, 100);
    
    setTimeout(() => {
      animState = 'GALAXY';
      controls.autoRotateSpeed = 2.0; 
      warpLinesSystem.material.opacity = 0.5; // Activa las líneas warp
      generarEstrellasInteractivas(); // Aparecen las 10 estrellas clickeables
    }, 2000); 
  }, 3500); 
}

// --- BUCLE PRINCIPAL (MÁQUINA DE ESTADOS) ---
function animate() {
  requestAnimationFrame(animate);
  const delta = clock.getDelta();
  timeElapsed += delta;

  // OBTENER DATOS DE AUDIO
  let avgBass = 0;
  if (analyser && dataArray) {
    analyser.getByteFrequencyData(dataArray);
    let sum = 0;
    for(let i = 0; i < 20; i++) sum += dataArray[i];
    avgBass = sum / 20; // Reacción a graves
  }

  const posiciones = particleGeometry.attributes.position.array;

  switch(animState) {
    case 'MORPH_HEART':
      if (morphProgress < 1) {
        morphProgress += delta * 0.055; 
        const ease = 1 - Math.pow(1 - morphProgress, 3);
        for (let i = 0; i < numParticles * 3; i++) {
          posiciones[i] = currentPositions[i] + (heartPositions[i] - currentPositions[i]) * ease;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      } else {
        animState = 'HEARTBEAT';
      }
      break;

    case 'HEARTBEAT':
      // El latido ahora reacciona a la música
      const audioScale = 1 + (avgBass / 256) * 0.2;
      mainGroup.scale.set(audioScale, audioScale, audioScale);
      bloomPass.strength = 1.5 + (avgBass / 256) * 1.5;
      break;

    case 'PRE_EXPLOSION':
      const fastBeat = Math.sin(timeElapsed * 20);
      const fastEscala = 1 + (fastBeat > 0 ? fastBeat * 0.4 : 0);
      mainGroup.scale.set(fastEscala, fastEscala, fastEscala);
      bloomPass.strength += delta * 4; 
      break;

    case 'EXPLOSION':
      mainGroup.scale.set(1, 1, 1);
      bloomPass.strength = 6.0; 
      
      for (let i = 0; i < numParticles * 3; i++) {
        posiciones[i] += explosionVelocities[i] * delta * 2.5;
      }
      particleGeometry.attributes.position.needsUpdate = true;

      shockwaveMesh.scale.x += delta * 100;
      shockwaveMesh.scale.y += delta * 100;
      shockwaveMesh.material.opacity = Math.max(0, shockwaveMesh.material.opacity - delta * 1.5);
      shockwaveMesh.lookAt(camera.position);
      break;

    case 'GALAXY':
      galaxyTimer += delta;

      if (galaxyTimer < 5) {
        const easeG = 1 - Math.pow(1 - (galaxyTimer/5), 4); 
        for (let i = 0; i < numParticles * 3; i++) {
          posiciones[i] += (galaxyPositions[i] - posiciones[i]) * easeG * 0.1;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      } else {
        for (let i = 0; i < numParticles; i++) {
          posiciones[i*3 + 1] = galaxyPositions[i*3 + 1] + Math.sin(timeElapsed * 1.5 + i) * 6;
        }
        particleGeometry.attributes.position.needsUpdate = true;
      }
      
      // Galaxia reacciona a la música
      const galScale = 1 + (avgBass / 256) * 0.05;
      mainGroup.scale.set(galScale, galScale, galScale);
      bloomPass.strength = 1.2 + (avgBass / 256) * 1.0;

      // ACTUALIZAR LÍNEAS WARP
      const linesPos = warpLinesSystem.geometry.attributes.position.array;
      const warpSpeed = 40 + (avgBass / 256) * 60; // Aceleran con la música
      for(let i=0; i<numWarpLines; i++){
        linesPos[i*6 + 2] += warpSpeed;
        linesPos[i*6 + 5] += warpSpeed;
        if(linesPos[i*6 + 2] > 1000) { 
          const nx = (Math.random() - 0.5) * 4000;
          const ny = (Math.random() - 0.5) * 4000;
          linesPos[i*6] = nx; linesPos[i*6+1] = ny; linesPos[i*6+2] = -3000;
          linesPos[i*6+3] = nx; linesPos[i*6+4] = ny; linesPos[i*6+5] = -3000 + 150;
        }
      }
      warpLinesSystem.geometry.attributes.position.needsUpdate = true;

      // DISPARAR AGUJERO NEGRO TRAS 60 SEGUNDOS
      if (galaxyTimer > 60) {
        animState = 'BLACK_HOLE';
        controls.autoRotateSpeed = 40.0; // Giro succionador
        warpLinesSystem.material.opacity = 0;
        interactiveStars.forEach(s => s.material.opacity = 0);
      }
      break;
      
    case 'BLACK_HOLE':
      // Succión hacia el centro (0,0,0)
      for (let i = 0; i < numParticles; i++) {
        posiciones[i*3] *= 0.94;     // Multiplicador de gravedad
        posiciones[i*3+1] *= 0.94;
        posiciones[i*3+2] *= 0.94;
      }
      particleGeometry.attributes.position.needsUpdate = true;
      mainGroup.scale.multiplyScalar(0.98); // Encoje la escena
      bloomPass.strength *= 0.95; // Apaga el brillo

      if (mainGroup.scale.x < 0.01) {
        animState = 'END';
        document.getElementById('texto-final-absoluto').style.display = 'block';
        setTimeout(() => document.getElementById('texto-final-absoluto').style.opacity = '1', 100);
      }
      break;
  }

  controls.update();
  composer.render();
}

function onWindowResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  composer.setSize(window.innerWidth, window.innerHeight);
}
</script>
</body>
</html>
